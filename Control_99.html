<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - BRAND SIM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background-color:#04101c;color:#fff;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start}

/* شاشة تسجيل الدخول */
#loginSection{width:100%;max-width:400px;margin-top:80px;background:radial-gradient(circle at top,#0a273d 0%,#04121f 100%);border:2px solid #00e5ff;border-radius:20px;padding:30px 20px;box-shadow:0 0 25px rgba(0,229,255,0.3);text-align:center}
.login-title{color:#00e5ff;font-size:1.5rem;font-weight:800;margin-bottom:20px}
.form-input{width:100%;background:#041523;border:1px solid rgba(0,229,255,0.35);border-radius:10px;padding:12px;color:#fff;font-size:1rem;margin-bottom:15px;outline:none}
.form-input:focus{border-color:#00e5ff;box-shadow:0 0 8px rgba(0,229,255,0.4)}
.btn-primary{width:100%;background:linear-gradient(90deg,#00d2ff,#00a8cc);color:#001b29;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:1rem;cursor:pointer}
.login-err{color:#ff5252;font-size:.85rem;margin-top:10px;display:none}

/* واجهة لوحة التحكم */
#adminPanel{display:none;width:100%;max-width:900px}
.panel-head{display:flex;justify-content:space-between;align-items:center;background:rgba(6,34,53,0.7);border:1.5px solid #00e5ff;border-radius:16px;padding:14px 20px;margin-bottom:20px}
.panel-head h2{color:#00e5ff;font-size:1.4rem}
.btn-logout{background:#ff5252;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-view{background:#00e5ff;color:#001b29;text-decoration:none;padding:8px 16px;border-radius:8px;font-weight:700}

.action-bar{background:#062335;border:1px solid rgba(0,229,255,0.3);border-radius:14px;padding:15px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap}
.action-bar input{flex:1;min-width:200px}
.action-bar button{width:auto;padding:10px 20px}

.company-box{background:rgba(6,26,41,0.6);border:1px solid rgba(0,229,255,0.4);border-radius:16px;padding:16px;margin-bottom:20px}
.comp-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,229,255,0.2);padding-bottom:10px;margin-bottom:14px}
.comp-title{font-size:1.2rem;font-weight:800;color:#00e5ff}
.comp-btns{display:flex;gap:8px}
.btn-sm{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:.85rem}
.btn-del{background:#e53935;color:#fff}
.btn-edit{background:#fb8c00;color:#fff}
.btn-add-pkg{background:#00c853;color:#fff}

.pkgs-table{width:100%;border-collapse:collapse;margin-top:10px}
.pkgs-table th,.pkgs-table td{padding:10px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.08);font-size:.9rem}
.pkgs-table th{color:#8ab4c9}
.status-badge{padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700;display:inline-block}
.status-available{background:rgba(0,200,83,0.2);color:#69f0ae;border:1px solid #00c853}
.status-unavailable{background:rgba(255,82,82,0.2);color:#ff8a80;border:1px solid #ff5252}

/* المودال */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,10,18,0.85);z-index:999;align-items:center;justify-content:center;padding:15px}
.modal-overlay.active{display:flex}
.modal-inner{background:#041523;border:2px solid #00e5ff;border-radius:16px;padding:20px;max-width:450px;width:100%}
.modal-inner h3{color:#00e5ff;margin-bottom:14px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.85rem;color:#8ab4c9;margin-bottom:4px}
.form-select{width:100%;background:#020b12;border:1px solid rgba(0,229,255,0.35);border-radius:10px;padding:10px;color:#fff;font-size:.95rem}
.modal-actions{display:flex;gap:10px;margin-top:16px}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginSection">
  <div class="login-title">🔐 تسجيل دخول المدير</div>
  <input type="password" id="adminPass" class="form-input" placeholder="كلمة المرور">
  <button type="button" class="btn-primary" id="loginBtn">دخول</button>
  <div class="login-err" id="loginError">كلمة المرور غير صحيحة!</div>
</div>

<!-- لوحة الإدارة -->
<div id="adminPanel">
  <div class="panel-head">
    <h2>⚙️ لوحة إدارة الباقات (BRAND SIM)</h2>
    <div style="display:flex;gap:10px">
      <a href="index.html" target="_blank" class="btn-view">🌐 عرض الموقع</a>
      <button type="button" class="btn-logout" id="logoutBtn">خروج</button>
    </div>
  </div>

  <div class="action-bar">
    <input type="text" id="newCompName" class="form-input" placeholder="اسم الشركة الرئيسية الجديدة (مثال: ألوها)..." style="margin-bottom:0">
    <button type="button" class="btn-primary" id="addCompBtn">➕ إضافة شركة</button>
  </div>

  <div id="companiesList"></div>
</div>

<!-- مودال الباقة الفرعية -->
<div id="pkgModal" class="modal-overlay">
  <div class="modal-inner">
    <h3 id="modalTitle">إضافة باقة فرعية</h3>
    <input type="hidden" id="modalCompIndex">
    <input type="hidden" id="modalPkgIndex">
    <div class="form-group">
      <label>اسم الباقة (مثال: باقة شهر):</label>
      <input type="text" id="pkgTitle" class="form-input">
    </div>
    <div class="form-group">
      <label>المدة (مثال: شهر، 3 شهور):</label>
      <input type="text" id="pkgDuration" class="form-input">
    </div>
    <div class="form-group">
      <label>السعر (بالشيكل):</label>
      <input type="number" id="pkgPrice" class="form-input">
    </div>
    <div class="form-group">
      <label>تفاصيل السعة (مثال: 100 جيجا):</label>
      <input type="text" id="pkgDesc" class="form-input">
    </div>
    <div class="form-group">
      <label>حالة التوفر:</label>
      <select id="pkgStatus" class="form-select">
        <option value="true">متوفر</option>
        <option value="false">غير متوفر</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-primary" id="savePkgBtn">حفظ الباقة</button>
      <button type="button" class="btn-logout" style="background:#455a64" id="closePkgModal">إلغاء</button>
    </div>
  </div>
</div>

<script>
(function(){
  const PASS = "Aa@@2468";
  const DEFAULT_DATA = [
    {name:"ألوها (Aloha)",pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
    {name:"بارتنر (Partner)",pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
    {name:"بيليفون (Pelephone)",pkgs:[{d:"باقة شهر",s:"شهر",p:55,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:140,g:"300 جيجا",available:true}]},
    {name:"سيلكوم (Cellcom)",pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:135,g:"300 جيجا",available:true}]},
    {name:"هوت موبايل (Hot Mobile)",pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
    {name:"جولان تليكوم (Golan)",pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
    {name:"019 موبايل (019 Mobile)",pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
    {name:"رامي ليفي (Rami Levy)",pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
    {name:"ويكوم (Wecom)",pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
    {name:"012 موبايل (012 Mobile)",pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
    {name:"يوفون (YouPhone)",pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]}
  ];

  function getData(){
    const stored = localStorage.getItem("brand_companies_data");
    if(!stored){
      localStorage.setItem("brand_companies_data", JSON.stringify(DEFAULT_DATA));
      return DEFAULT_DATA;
    }
    return JSON.parse(stored);
  }

  function saveData(data){
    localStorage.setItem("brand_companies_data", JSON.stringify(data));
    render();
  }

  // المصادقة
  if(sessionStorage.getItem("brand_admin_auth") === "true"){
    showPanel();
  }

  document.getElementById("loginBtn").addEventListener("click", () => {
    const p = document.getElementById("adminPass").value;
    if(p === PASS){
      sessionStorage.setItem("brand_admin_auth", "true");
      showPanel();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem("brand_admin_auth");
    location.reload();
  });

  function showPanel(){
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    render();
  }

  // رسم الشركات والباقات
  function render(){
    const list = document.getElementById("companiesList");
    list.innerHTML = "";
    const data = getData();

    data.forEach((comp, cIdx) => {
      const box = document.createElement("div");
      box.className = "company-box";
      box.innerHTML = `
        <div class="comp-top">
          <div class="comp-title">🏢 ${comp.name}</div>
          <div class="comp-btns">
            <button class="btn-sm btn-add-pkg" onclick="openPkgModal(${cIdx})">➕ باقة فرعية</button>
            <button class="btn-sm btn-edit" onclick="editCompName(${cIdx})">✏️ تعديل الاسم</button>
            <button class="btn-sm btn-del" onclick="deleteComp(${cIdx})">🗑️ حذف</button>
          </div>
        </div>
        <table class="pkgs-table">
          <thead>
            <tr>
              <th>الباقة</th>
              <th>المدة</th>
              <th>السعر</th>
              <th>المواصفات</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${(comp.pkgs || []).map((pkg, pIdx) => `
              <tr>
                <td>${pkg.d}</td>
                <td>${pkg.s}</td>
                <td>${pkg.p} ₪</td>
                <td>${pkg.g}</td>
                <td>
                  <span class="status-badge ${pkg.available !== false ? 'status-available' : 'status-unavailable'}">
                    ${pkg.available !== false ? 'متوفر' : 'غير متوفر'}
                  </span>
                </td>
                <td>
                  <button class="btn-sm btn-edit" onclick="openPkgModal(${cIdx}, ${pIdx})">تعديل</button>
                  <button class="btn-sm btn-del" onclick="deletePkg(${cIdx}, ${pIdx})">حذف</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      list.appendChild(box);
    });
  }

  // إدارة الشركات
  document.getElementById("addCompBtn").addEventListener("click", () => {
    const input = document.getElementById("newCompName");
    const name = input.value.trim();
    if(!name) return alert("يرجى كتابة اسم الشركة");
    const data = getData();
    data.push({ name: name, pkgs: [] });
    saveData(data);
    input.value = "";
  });

  window.editCompName = function(idx){
    const data = getData();
    const newName = prompt("تعديل اسم الشركة:", data[idx].name);
    if(newName && newName.trim()){
      data[idx].name = newName.trim();
      saveData(data);
    }
  };

  window.deleteComp = function(idx){
    if(confirm("هل أنت متأكد من حذف هذه الشركة وجميع باقاتها؟")){
      const data = getData();
      data.splice(idx, 1);
      saveData(data);
    }
  };

  // إدارة الباقات الفرعية
  const pkgModal = document.getElementById("pkgModal");
  window.openPkgModal = function(cIdx, pIdx = null){
    const data = getData();
    document.getElementById("modalCompIndex").value = cIdx;
    document.getElementById("modalPkgIndex").value = pIdx !== null ? pIdx : "";
    
    if(pIdx !== null){
      const pkg = data[cIdx].pkgs[pIdx];
      document.getElementById("modalTitle").textContent = "تعديل الباقة الفرعية";
      document.getElementById("pkgTitle").value = pkg.d;
      document.getElementById("pkgDuration").value = pkg.s;
      document.getElementById("pkgPrice").value = pkg.p;
      document.getElementById("pkgDesc").value = pkg.g;
      document.getElementById("pkgStatus").value = (pkg.available !== false).toString();
    } else {
      document.getElementById("modalTitle").textContent = "إضافة باقة فرعية";
      document.getElementById("pkgTitle").value = "";
      document.getElementById("pkgDuration").value = "";
      document.getElementById("pkgPrice").value = "";
      document.getElementById("pkgDesc").value = "";
      document.getElementById("pkgStatus").value = "true";
    }
    pkgModal.classList.add("active");
  };

  document.getElementById("closePkgModal").addEventListener("click", () => {
    pkgModal.classList.remove("active");
  });

  document.getElementById("savePkgBtn").addEventListener("click", () => {
    const cIdx = document.getElementById("modalCompIndex").value;
    const pIdx = document.getElementById("modalPkgIndex").value;
    const d = document.getElementById("pkgTitle").value.trim();
    const s = document.getElementById("pkgDuration").value.trim();
    const p = parseFloat(document.getElementById("pkgPrice").value);
    const g = document.getElementById("pkgDesc").value.trim();
    const available = document.getElementById("pkgStatus").value === "true";

    if(!d || !s || isNaN(p)){
      return alert("يرجى ملء جميع الحقول بشكل صحيح");
    }

    const data = getData();
    const pkgObj = { d, s, p, g, available };

    if(pIdx !== ""){
      data[cIdx].pkgs[pIdx] = pkgObj;
    } else {
      if(!data[cIdx].pkgs) data[cIdx].pkgs = [];
      data[cIdx].pkgs.push(pkgObj);
    }

    saveData(data);
    pkgModal.classList.remove("active");
  });

  window.deletePkg = function(cIdx, pIdx){
    if(confirm("هل أنت متأكد من حذف هذه الباقة؟")){
      const data = getData();
      data[cIdx].pkgs.splice(pIdx, 1);
      saveData(data);
    }
  };

})();
</script>
</body>
  </html>
