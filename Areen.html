<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براند سيم | تحديث رقم الهاتف</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: #1e293b;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2.25rem 1.5rem 1.75rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 5px;
            background: linear-gradient(90deg, #2563eb, #38bdf8, #1d4ed8);
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 16px;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .brand-sub {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 1.75rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .phone-input {
            width: 100%;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 1.1rem;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            text-align: center;
            letter-spacing: 1.5px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
            direction: ltr;
        }

        .phone-input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .phone-input::placeholder {
            color: #94a3b8;
            letter-spacing: 0;
            font-weight: 400;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            margin: 1.25rem auto 0;
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            display: none;
            margin-top: 1rem;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.5;
            border: 1px solid transparent;
        }

        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            border-color: #a7f3d0;
        }

        .alert-warning {
            background: #fffbeb;
            color: #92400e;
            border-color: #fde68a;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V19a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 11h6v6H9z" />
            </svg>
        </div>

        <div class="brand-name">BRAND SIM</div>
        <div class="brand-sub">براند سيم - تحديث رقم الهاتف</div>

        <form id="simForm">
            <div class="input-group">
                <input type="tel"
                       id="mobileNumber"
                       class="phone-input"
                       placeholder="05XXXXXXXX"
                       required
                       maxlength="10"
                       pattern="^05\d{8}$"
                       inputmode="numeric"
                       autocomplete="tel">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                تحديث الرقم الآن
            </button>
        </form>

        <div id="spinner" class="spinner"></div>
        <div id="resultBox" class="alert"></div>

        <a href="index.html" class="back-link">العودة للصفحة الرئيسية</a>
        <div class="footer">جميع الحقوق محفوظة © براند سيم</div>
    </div>

    <script>
        const API_URL = 'https://api.areen.net/api/common/RefreshMobileNumber';
        // في حال قمت بعمل Cloudflare Worker مستقبلاً، ضع رابطه هنا
        const WORKER_URL = ''; 

        const form = document.getElementById('simForm');
        const input = document.getElementById('mobileNumber');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const resultBox = document.getElementById('resultBox');

        // تنظيف المدخلات لقبول الأرقام فقط
        input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        function showMessage(text, type) {
            resultBox.textContent = text;
            resultBox.className = 'alert alert-' + type;
            resultBox.style.display = 'block';
        }

        async function sendUpdateRequest(mobNumber) {
            const payload = JSON.stringify({ MobNumber: mobNumber });
            const targetUrl = WORKER_URL || API_URL;

            try {
                // المحاولة الأولى: اتصال مباشر بالسيرفر
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
                return await response.json();
            } catch (directError) {
                // المحاولة الثانية التلقائية عبر CORS Proxy في حال وجود حظر من المتصفح
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(API_URL);
                const proxyResponse = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
                return await proxyResponse.json();
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const mobNumber = input.value.trim();

            if (!/^05\d{8}$/.test(mobNumber)) {
                showMessage('يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05', 'warning');
                return;
            }

            submitBtn.disabled = true;
            spinner.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const data = await sendUpdateRequest(mobNumber);

                if (data && data.StatusCode === 23) {
                    showMessage('✅ تم تحديث رقم الهاتف بنجاح!', 'success');
                } else {
                    showMessage((data && data.Message) ? data.Message : '⚠️ تعذر تحديث الرقم حالياً.', 'warning');
                }
            } catch (error) {
                showMessage('❌ تعذر الاتصال بالخادم، يرجى التأكد من الإنترنت والمحاولة مجدداً.', 'error');
            } finally {
                submitBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
