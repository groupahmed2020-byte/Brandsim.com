<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براند سيم | تحديث الرقم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #38bdf8);
            color: white;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
            direction: ltr;
        }

        input[type="tel"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background-color: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-msg {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .status-msg.success {
            display: block;
            background-color: #ecfdf5;
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        .status-msg.error {
            display: block;
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-logo">BS</div>
        <h1>براند سيم</h1>
        <p class="subtitle">أدخل رقم الهاتف لإجراء تحديث وتنشيط للخط</p>

        <form id="refreshForm">
            <div class="form-group">
                <input type="tel" id="phoneNumber" placeholder="05XXXXXXXX" maxlength="10" required autocomplete="off">
            </div>
            <button type="submit" id="submitBtn">
                <span id="btnText">تحديث الرقم</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <div id="statusMessage" class="status-msg"></div>

        <div class="footer">
            Brand Sim © <span id="year"></span>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // الاتصال بملف البروكسي المشترك في نفس المجلد
        const API_URL = "proxy.php";

        const form = document.getElementById('refreshForm');
        const phoneInput = document.getElementById('phoneNumber');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const phone = phoneInput.value.trim();
            if (!phone) return;

            // التحقق من صحة الرقم محلياً قبل الإرسال
            const regex = /^05\d{8}$/;
            if (!regex.test(phone)) {
                statusMessage.textContent = "يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05";
                statusMessage.className = "status-msg error";
                return;
            }

            // تفعيل حالة التحميل
            submitBtn.disabled = true;
            btnText.textContent = "جاري التحديث...";
            btnSpinner.style.display = "inline-block";
            statusMessage.className = "status-msg";
            statusMessage.style.display = "none";

            try {
                // إرسال الحقل phoneNumber ليتعرف البروكسي على كويك لاين تلقائياً
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json, text/plain, */*"
                    },
                    body: JSON.stringify({ phoneNumber: phone })
                });

                const data = await response.json();

                if (response.ok && (data.StatusCode === 200 || !data.StatusCode)) {
                    statusMessage.textContent = data.Message || "تم تحديث الرقم بنجاح!";
                    statusMessage.className = "status-msg success";
                    phoneInput.value = "";
                } else {
                    statusMessage.textContent = data.Message || "تعذر تحديث الرقم، يرجى المحاولة لاحقاً.";
                    statusMessage.className = "status-msg error";
                }
            } catch (error) {
                statusMessage.textContent = "حدث خطأ في الاتصال بالسيرفر.";
                statusMessage.className = "status-msg error";
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "تحديث الرقم";
                btnSpinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
