<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة تشفير قاعدة بيانات المشتركين</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { background: #1e293b; padding: 30px; border-radius: 16px; max-width: 500px; text-align: center; border: 1px solid #334155; }
        button { background: #10b981; color: #000; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 تشفير قاعدة المشتركين وحذف الوكلاء</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">تقوم هذه الأداة بقراءة ملف customers.json الحالي، وحذف بيانات الوكلاء وأرقام الهواتف الصريحة، واستبدالها بقيم SHA-256 المشفرة المتوافقة مع check.html.</p>
        <button id="runBtn" onclick="processDatabase()">تشفير وتحميل customers.json المشفر</button>
        <div id="status"></div>
    </div>
    <script>
        // دالة تنظيف رقم الهاتف
        function normPhone(raw) {
            if (!raw) return '';
            const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            let s = String(raw);
            for (let i = 0; i < 10; i++) s = s.replace(new RegExp(ar[i], 'g'), i);
            let c = s.replace(/[^0-9]/g, '');
            if (c.startsWith('00972') || c.startsWith('00970')) c = '0' + c.slice(5);
            else if ((c.startsWith('972') || c.startsWith('970')) && c.length >= 11) c = '0' + c.slice(3);
            else if (c.length === 9 && c.startsWith('5')) c = '0' + c;
            return c;
        }

        // دالة إنشاء التشفير المتطابقة مع صفحة الاستعلام
        async function hashPhone(phone) {
            const clean = normPhone(phone);
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('BS_PHONE_2026_' + clean));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // دالة معالجة قاعدة البيانات
        async function processDatabase() {
            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = '⏳ جاري قراءة ملف customers.json...';

            try {
                // قراءة الملف القديم من نفس المجلد
                const res = await fetch('customers.json?t=' + Date.now());
                if (!res.ok) throw new Error('تعذر العثور على ملف customers.json في نفس المجلد.');
                const originalList = await res.json();

                status.textContent = `⏳ جاري تشفير ${originalList.length} مشترك وحذف بيانات الوكلاء...`;

                const securedList = [];
                for (const item of originalList) {
                    const phoneToHash = item.simPhone || item.contactPhone || item.name;
                    if (!phoneToHash) continue;

                    const hashed = await hashPhone(phoneToHash);

                    // تنظيف وصف الحزمة من أي أرقام هواتف
                    const cleanPkg = String(item.packageInfo || item.pkgName || 'حزمة إنترنت')
                        .replace(/05[0-9]{8}/g, '')
                        .replace(/\(.*?\)/g, '')
                        .trim();

                    // حفظ البيانات الآمنة فقط (بدون أي أرقام أو أسماء وكلاء)
                    securedList.push({
                        id: item.id || Date.now(),
                        phoneHash: hashed,
                        startDate: item.startDate || '',
                        expiryDate: item.expiryDate || '',
                        packageInfo: cleanPkg || 'حزمة إنترنت',
                        priceNote: item.priceNote || '00'
                    });
                }

                // تنزيل الملف الجديد المشفر
                const blob = new Blob([JSON.stringify(securedList, null, 2)], { type: 'application/json;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'customers.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                status.innerHTML = `✅ تم التشفير بنجاح! تم تنزيل ملف <b>customers.json</b> المشفر بالكامل.`;
            } catch (err) {
                status.textContent = '❌ خطأ: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
