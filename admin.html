<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - إدارة الباقات والشرائح | BRAND SIM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background-color:#04101c;
  color:#fff;
  min-height:100vh;
  padding:15px;
  background-image:radial-gradient(ellipse at top,#072033 0%,#04101c 70%);
}

/* شاشة تسجيل الدخول */
#loginSection{
  width:100%;
  max-width:420px;
  margin:70px auto;
  background:radial-gradient(circle at top,#0a2a42 0%,#041423 100%);
  border:2px solid #00e5ff;
  border-radius:22px;
  padding:32px 22px;
  box-shadow:0 0 35px rgba(0,229,255,0.25);
  text-align:center;
}
.login-title{color:#00e5ff;font-size:1.6rem;font-weight:900;margin-bottom:8px}
.login-sub{color:#8ab4c9;font-size:.9rem;margin-bottom:22px}
.form-input,.form-select{
  width:100%;
  background:#03121e;
  border:1.5px solid rgba(0,229,255,0.35);
  border-radius:12px;
  padding:11px 14px;
  color:#fff;
  font-size:.95rem;
  margin-bottom:14px;
  outline:none;
  transition:.25s;
}
.form-input:focus,.form-select:focus{
  border-color:#00e5ff;
  box-shadow:0 0 12px rgba(0,229,255,0.4);
}
.btn-primary{
  background:linear-gradient(90deg,#00d2ff,#00a8cc);
  color:#001b29;
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-weight:800;
  font-size:1rem;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.2s;
  box-shadow:0 0 15px rgba(0,210,255,0.3);
}
.btn-primary:active{transform:scale(0.98)}
.login-err{
  color:#ff5252;
  font-size:.88rem;
  font-weight:700;
  margin-top:12px;
  display:none;
  background:rgba(255,82,82,0.12);
  padding:8px;
  border-radius:8px;
  border:1px solid #ff5252;
}

/* لوحة الإدارة العامة */
#adminPanel{display:none;max-width:1100px;margin:0 auto}
.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(6,34,53,0.85);
  border:1.5px solid #00e5ff;
  border-radius:18px;
  padding:14px 20px;
  margin-bottom:18px;
  box-shadow:0 0 20px rgba(0,229,255,0.2);
  flex-wrap:wrap;
  gap:12px;
}
.brand-head-title{
  color:#00e5ff;
  font-size:1.4rem;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:8px;
}
.head-actions{display:flex;align-items:center;gap:10px}
.btn-save-all{
  background:linear-gradient(90deg,#00e676,#00b0ff);
  color:#021422;
  font-weight:900;
  padding:9px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,230,118,0.4);
  font-size:.92rem;
  display:inline-flex;
  align-items:center;
  gap:6px;
  animation:pulse 2s infinite alternate;
}
@keyframes pulse{
  0%{box-shadow:0 0 12px rgba(0,230,118,0.3)}
  100%{box-shadow:0 0 22px rgba(0,230,118,0.7)}
}
.btn-site{
  background:rgba(0,229,255,0.15);
  color:#00e5ff;
  text-decoration:none;
  padding:9px 15px;
  border-radius:10px;
  font-weight:700;
  border:1px solid #00e5ff;
  font-size:.9rem;
}
.btn-logout{
  background:rgba(255,82,82,0.15);
  color:#ff5252;
  border:1px solid #ff5252;
  padding:9px 15px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  font-size:.9rem;
}

/* التبويبات بين الالكتروني والبلاستيك */
.nav-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:20px;
}
.nav-tab-btn{
  background:rgba(6,27,43,0.6);
  border:2px solid rgba(0,229,255,0.3);
  border-radius:16px;
  padding:15px;
  color:#fff;
  font-weight:800;
  font-size:1.1rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:.2s;
}
.nav-tab-btn.active{
  border-color:#00e5ff;
  background:rgba(10,48,74,0.85);
  box-shadow:0 0 20px rgba(0,229,255,0.35);
  color:#00e5ff;
}

/* شريط إضافة شركة رئيسية */
.add-bar{
  background:rgba(6,35,53,0.7);
  border:1px solid rgba(0,229,255,0.35);
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}
.add-bar input{margin-bottom:0;flex:1;min-width:240px}

/* بطاقة الشركة */
.comp-card{
  background:rgba(6,26,41,0.75);
  border:1.5px solid rgba(0,229,255,0.35);
  border-radius:18px;
  padding:18px;
  margin-bottom:20px;
  backdrop-filter:blur(4px);
}
.comp-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(0,229,255,0.25);
  padding-bottom:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
  gap:10px;
}
.comp-title{
  font-size:1.25rem;
  font-weight:900;
  color:#fff;
  display:flex;
  align-items:center;
  gap:8px;
}
.comp-badge{
  font-size:.78rem;
  padding:3px 10px;
  border-radius:20px;
  font-weight:700;
}
.badge-esim{background:rgba(0,229,255,0.18);border:1px solid #00e5ff;color:#00e5ff}
.badge-plastic{background:rgba(255,183,77,0.18);border:1px solid #ffb74d;color:#ffb74d}
.comp-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn-action{
  padding:7px 12px;
  border-radius:8px;
  font-weight:700;
  font-size:.85rem;
  border:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.btn-add-sub{background:#00c853;color:#fff}
.btn-edit-comp{background:#fb8c00;color:#fff}
.btn-del-comp{background:#e53935;color:#fff}

/* جدول الباقات */
.table-responsive{overflow-x:auto}
.pkg-table{width:100%;border-collapse:collapse;margin-top:8px}
.pkg-table th{background:rgba(3,18,30,0.6);color:#8ab4c9;padding:10px 12px;font-size:.85rem;border-bottom:1px solid rgba(0,229,255,0.2)}
.pkg-table td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:.9rem}
.status-pill{
  padding:4px 12px;
  border-radius:20px;
  font-size:.78rem;
  font-weight:800;
  display:inline-block;
}
.status-pill.avail{background:rgba(0,200,83,0.18);border:1px solid #00c853;color:#69f0ae}
.status-pill.unavail{background:rgba(255,82,82,0.18);border:1px solid #ff5252;color:#ff8a80}

.price-text{color:#00e5ff;font-weight:800;font-size:1.05rem}

/* الإشعار السريع (Toast) للحفظ الفوري */
#toastBox{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:rgba(4,24,38,0.95);
  border:2px solid #00e676;
  color:#fff;
  padding:12px 24px;
  border-radius:30px;
  box-shadow:0 0 25px rgba(0,230,118,0.45);
  font-weight:800;
  font-size:.95rem;
  z-index:9999;
  display:flex;
  align-items:center;
  gap:10px;
  opacity:0;
  transition:all .3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
#toastBox.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* المودال */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,10,18,0.85);backdrop-filter:blur(6px);z-index:3000;align-items:center;justify-content:center;padding:15px}
.modal-overlay.active{display:flex}
.modal-content{
  width:100%;
  max-width:460px;
  background:radial-gradient(circle at top,#0a273d 0%,#04121f 100%);
  border:2px solid #00e5ff;
  border-radius:20px;
  padding:22px;
  box-shadow:0 0 30px rgba(0,229,255,0.35);
}
.modal-title{color:#00e5ff;font-size:1.3rem;font-weight:800;margin-bottom:16px;text-align:center}
.form-label{display:block;font-size:.85rem;color:#8ab4c9;margin-bottom:5px;font-weight:700}
.modal-footer{display:flex;gap:10px;margin-top:18px}
.btn-cancel{background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginSection">
  <div style="font-size:3rem;margin-bottom:10px">🛡️</div>
  <div class="login-title">لوحة تحكم BRAND SIM</div>
  <div class="login-sub">يرجى إدخال كلمة المرور للوصول لإدارة الباقات</div>
  <input type="password" id="adminPass" class="form-input" placeholder="كلمة المرور">
  <button type="button" class="btn-primary" style="width:100%" id="loginBtn">تسجيل الدخول 🔑</button>
  <div class="login-err" id="loginError">⚠️ كلمة المرور غير صحيحة!</div>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel">
  <!-- ترويسة اللوحة -->
  <div class="panel-header">
    <div class="brand-head-title">⚙️ لوحة إدارة الباقات والشرائح</div>
    <div class="head-actions">
      <button type="button" class="btn-save-all" id="instantSaveBtn">
        💾 حفظ فوري وتطبيق
      </button>
      <a href="index.html" target="_blank" class="btn-site">🌐 معاينة الموقع</a>
      <button type="button" class="btn-logout" id="logoutBtn">خروج</button>
    </div>
  </div>

  <!-- التبويبات بين قسم الـ eSIM وقسم البلاستيك -->
  <div class="nav-tabs">
    <div class="nav-tab-btn active" id="tabEsimBtn">
      <span>📲 شرائح إلكترونية (eSIM)</span>
      <span class="comp-badge badge-esim" id="esimCompCount">0 شركة</span>
    </div>
    <div class="nav-tab-btn" id="tabPlasticBtn">
      <span>💳 شرائح بلاستيكية (Plastic)</span>
      <span class="comp-badge badge-plastic" id="plasticCompCount">0 شركة</span>
    </div>
  </div>

  <!-- شريط إضافة شركة رئيسية في القسم الحالي -->
  <div class="add-bar">
    <span style="font-weight:800;color:#00e5ff" id="addCompLabel">➕ إضافة شركة رئيسية لـ eSIM:</span>
    <input type="text" id="newCompName" class="form-input" placeholder="اسم الشركة الرئيسية (مثال: ألوها، بارتنر...)">
    <button type="button" class="btn-primary" id="addCompanyBtn">إضافة الشركة</button>
  </div>

  <!-- حاوية الشركات والباقات للقسم الفعّال -->
  <div id="companiesContainer"></div>
</div>

<!-- نافذة مودال: إضافة / تعديل باقة فرعية -->
<div id="pkgModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">📦 إضافة باقة فرعية</div>
    <input type="hidden" id="modalCompIdx">
    <input type="hidden" id="modalPkgIdx">
    
    <div class="form-group">
      <label class="form-label">القسم الموجه له:</label>
      <select id="modalSimType" class="form-select">
        <option value="esim">📲 شريحة إلكترونية (eSIM)</option>
        <option value="plastic">💳 شريحة بلاستيكية (Plastic)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">عنوان الباقة (مثال: باقة شهر):</label>
      <input type="text" id="pkgNameInput" class="form-input" placeholder="باقة شهر / 3 شهور">
    </div>
    <div class="form-group">
      <label class="form-label">المدة الزمنية (مثال: شهر، 3 شهور):</label>
      <input type="text" id="pkgDurationInput" class="form-input" placeholder="شهر / 3 شهور">
    </div>
    <div class="form-group">
      <label class="form-label">السعر (شيكل ₪):</label>
      <input type="number" id="pkgPriceInput" class="form-input" placeholder="مثال: 50">
    </div>
    <div class="form-group">
      <label class="form-label">المواصفات والسعة (مثال: 100 جيجا):</label>
      <input type="text" id="pkgDataInput" class="form-input" placeholder="100 جيجا">
    </div>
    <div class="form-group">
      <label class="form-label">حالة التوفر:</label>
      <select id="pkgAvailSelect" class="form-select">
        <option value="true">✅ متوفر للطلب</option>
        <option value="false">❌ غير متوفر حالياً</option>
      </select>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-primary" style="flex:1" id="savePkgModalBtn">💾 حفظ وتحديث الباقة</button>
      <button type="button" class="btn-cancel" id="cancelPkgModalBtn">إلغاء</button>
    </div>
  </div>
</div>

<!-- إشعار الحفظ الفوري -->
<div id="toastBox">
  <span style="font-size:1.3rem">✅</span>
  <span id="toastMsg">تم الحفظ الفوري وتحديث الموقع بنجاح!</span>
</div>

<script>
(function(){
  "use strict";
  const PASSWORD = "Aa@@2468";
  const STORAGE_KEY = "brand_sim_store_data_v2";

  // الباقات الافتراضية للنوعين: eSIM وبلاستيك
  const DEFAULT_INITIAL_DATA = {
    esim: [
      {name:"ألوها (Aloha)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"بارتنر (Partner)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"بيليفون (Pelephone)", pkgs:[{d:"باقة شهر",s:"شهر",p:55,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:140,g:"300 جيجا",available:true}]},
      {name:"سيلكوم (Cellcom)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:135,g:"300 جيجا",available:true}]},
      {name:"هوت موبايل (Hot Mobile)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"جولان تليكوم (Golan)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"019 موبايل (019 Mobile)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"رامي ليفي (Rami Levy)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"ويكوم (Wecom)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"012 موبايل (012 Mobile)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"يوفون (YouPhone)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]}
    ],
    plastic: [
      {name:"بارتنر بلاستيك (Partner)", pkgs:[{d:"باقة شهرية عادية",s:"شهر",p:55,g:"80 جيجا",available:true},{d:"باقة 3 شهور توفير",s:"3 شهور",p:135,g:"250 جيجا",available:true}]},
      {name:"بيليفون بلاستيك (Pelephone)", pkgs:[{d:"باقة شهرية",s:"شهر",p:60,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:150,g:"300 جيجا",available:true}]},
      {name:"سيلكوم بلاستيك (Cellcom)", pkgs:[{d:"باقة شهر",s:"شهر",p:55,g:"90 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:140,g:"270 جيجا",available:true}]},
      {name:"هوت موبايل بلاستيك (Hot)", pkgs:[{d:"باقة اقتصادية شهر",s:"شهر",p:50,g:"80 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:125,g:"240 جيجا",available:true}]}
    ]
  };

  let currentTab = "esim"; // 'esim' أو 'plastic'

  function loadAppData(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_INITIAL_DATA));
      return JSON.parse(JSON.stringify(DEFAULT_INITIAL_DATA));
    }
    try{
      return JSON.parse(raw);
    }catch(e){
      return JSON.parse(JSON.stringify(DEFAULT_INITIAL_DATA));
    }
  }

  function saveAppData(data, showNotification = true){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if(showNotification){
      showToast("💾 تم الحفظ الفوري بنجاح وتحديث البيانات في الموقع!");
    }
    render();
  }

  function showToast(msg){
    const toast = document.getElementById("toastBox");
    document.getElementById("toastMsg").textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>{ toast.classList.remove("show"); }, 2800);
  }

  // التحقق من الدخول
  if(sessionStorage.getItem("admin_auth_brand") === "true"){
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    render();
  }

  document.getElementById("loginBtn").addEventListener("click", () => {
    const p = document.getElementById("adminPass").value;
    if(p === PASSWORD){
      sessionStorage.setItem("admin_auth_brand", "true");
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      render();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem("admin_auth_brand");
    location.reload();
  });

  // التبديل بين التبويبات
  document.getElementById("tabEsimBtn").addEventListener("click", function(){
    currentTab = "esim";
    this.classList.add("active");
    document.getElementById("tabPlasticBtn").classList.remove("active");
    document.getElementById("addCompLabel").textContent = "➕ إضافة شركة رئيسية لـ eSIM:";
    render();
  });

  document.getElementById("tabPlasticBtn").addEventListener("click", function(){
    currentTab = "plastic";
    this.classList.add("active");
    document.getElementById("tabEsimBtn").classList.remove("active");
    document.getElementById("addCompLabel").textContent = "➕ إضافة شركة رئيسية لشرائح البلاستيك:";
    render();
  });

  // زر الحفظ الفوري الرئيسي
  document.getElementById("instantSaveBtn").addEventListener("click", () => {
    const data = loadAppData();
    saveAppData(data, true);
  });

  // إضافة شركة رئيسية
  document.getElementById("addCompanyBtn").addEventListener("click", () => {
    const inp = document.getElementById("newCompName");
    const val = inp.value.trim();
    if(!val) return alert("يرجى كتابة اسم الشركة أولاً!");
    const data = loadAppData();
    if(!data[currentTab]) data[currentTab] = [];
    data[currentTab].push({ name: val, pkgs: [] });
    saveAppData(data, true);
    inp.value = "";
  });

  // رسم الواجهة
  function render(){
    const data = loadAppData();
    const esimList = data.esim || [];
    const plasticList = data.plastic || [];

    document.getElementById("esimCompCount").textContent = esimList.length + " شركة";
    document.getElementById("plasticCompCount").textContent = plasticList.length + " شركة";

    const container = document.getElementById("companiesContainer");
    container.innerHTML = "";

    const activeList = data[currentTab] || [];
    if(activeList.length === 0){
      container.innerHTML = `<div style="text-align:center;padding:40px;color:#8ab4c9;background:rgba(6,26,41,0.5);border-radius:16px;">لا توجد شركات مضافة في هذا القسم حالياً. استخدم الشريط بالأعلى لإضافة شركة جديدة!</div>`;
      return;
    }

    activeList.forEach((comp, cIdx) => {
      const card = document.createElement("div");
      card.className = "comp-card";

      const badgeType = currentTab === "esim" 
        ? `<span class="comp-badge badge-esim">📲 باقة إلكترونية eSIM</span>`
        : `<span class="comp-badge badge-plastic">💳 شريحة بلاستيكية</span>`;

      card.innerHTML = `
        <div class="comp-header">
          <div class="comp-title">
            <span>🏢 ${comp.name}</span>
            ${badgeType}
          </div>
          <div class="comp-actions">
            <button class="btn-action btn-add-sub" onclick="openModal('${currentTab}', ${cIdx})">➕ باقة فرعية</button>
            <button class="btn-action btn-edit-comp" onclick="renameCompany('${currentTab}', ${cIdx})">✏️ تعديل الاسم</button>
            <button class="btn-action btn-del-comp" onclick="removeCompany('${currentTab}', ${cIdx})">🗑️ حذف الشركة</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="pkg-table">
            <thead>
              <tr>
                <th>عنوان الباقة</th>
                <th>المدة</th>
                <th>السعر</th>
                <th>المواصفات / السعة</th>
                <th>حالة التوفر</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody>
              ${(comp.pkgs && comp.pkgs.length > 0) ? comp.pkgs.map((pkg, pIdx) => `
                <tr>
                  <td style="font-weight:700">${pkg.d}</td>
                  <td>${pkg.s}</td>
                  <td class="price-text">${pkg.p} ₪</td>
                  <td>${pkg.g}</td>
                  <td>
                    <span class="status-pill ${pkg.available !== false ? 'avail' : 'unavail'}">
                      ${pkg.available !== false ? '✅ متوفر' : '❌ غير متوفر'}
                    </span>
                  </td>
                  <td>
                    <button class="btn-action btn-edit-comp" style="padding:4px 8px" onclick="openModal('${currentTab}', ${cIdx}, ${pIdx})">✏️ تعديل</button>
                    <button class="btn-action btn-del-comp" style="padding:4px 8px" onclick="removePkg('${currentTab}', ${cIdx}, ${pIdx})">🗑️ حذف</button>
                  </td>
                </tr>
              `).join("") : `<tr><td colspan="6" style="text-align:center;color:#8ab4c9;padding:15px">لا توجد باقات فرعية مضافة حتى الآن. اضغط على "➕ باقة فرعية" لإضافة أول باقة.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // تعديل وحذف الشركة
  window.renameCompany = function(type, idx){
    const data = loadAppData();
    const curr = data[type][idx].name;
    const newName = prompt("تعديل اسم الشركة الرئيسية:", curr);
    if(newName && newName.trim() && newName.trim() !== curr){
      data[type][idx].name = newName.trim();
      saveAppData(data, true);
    }
  };

  window.removeCompany = function(type, idx){
    const data = loadAppData();
    const name = data[type][idx].name;
    if(confirm(`هل أنت متأكد من حذف شركة "${name}" وجميع الباقات التابعة لها؟`)){
      data[type].splice(idx, 1);
      saveAppData(data, true);
    }
  };

  // مودال الباقات الفرعية
  const modal = document.getElementById("pkgModal");

  window.openModal = function(type, cIdx, pIdx = null){
    const data = loadAppData();
    document.getElementById("modalCompIdx").value = cIdx;
    document.getElementById("modalPkgIdx").value = pIdx !== null ? pIdx : "";
    document.getElementById("modalSimType").value = type;

    if(pIdx !== null){
      const pkg = data[type][cIdx].pkgs[pIdx];
      document.getElementById("modalTitle").textContent = "✏️ تعديل الباقة الفرعية";
      document.getElementById("pkgNameInput").value = pkg.d || "";
      document.getElementById("pkgDurationInput").value = pkg.s || "";
      document.getElementById("pkgPriceInput").value = pkg.p || "";
      document.getElementById("pkgDataInput").value = pkg.g || "";
      document.getElementById("pkgAvailSelect").value = (pkg.available !== false).toString();
    } else {
      document.getElementById("modalTitle").textContent = "➕ إضافة باقة فرعية جديدة";
      document.getElementById("pkgNameInput").value = "";
      document.getElementById("pkgDurationInput").value = "";
      document.getElementById("pkgPriceInput").value = "";
      document.getElementById("pkgDataInput").value = "";
      document.getElementById("pkgAvailSelect").value = "true";
    }
    modal.classList.add("active");
  };

  document.getElementById("cancelPkgModalBtn").addEventListener("click", () => {
    modal.classList.remove("active");
  });

  // حفظ الباقة الفرعية وتطبيق الحفظ الفوري
  document.getElementById("savePkgModalBtn").addEventListener("click", () => {
    const cIdx = document.getElementById("modalCompIdx").value;
    const pIdx = document.getElementById("modalPkgIdx").value;
    const targetType = document.getElementById("modalSimType").value;

    const d = document.getElementById("pkgNameInput").value.trim();
    const s = document.getElementById("pkgDurationInput").value.trim();
    const p = parseFloat(document.getElementById("pkgPriceInput").value);
    const g = document.getElementById("pkgDataInput").value.trim();
    const available = document.getElementById("pkgAvailSelect").value === "true";

    if(!d || !s || isNaN(p)){
      return alert("يرجى إدخال اسم الباقة، المدة، والسعر بشكل صحيح!");
    }

    const data = loadAppData();
    const pkgObj = { d, s, p, g, available };

    if(pIdx !== ""){
      // تعديل باقة موجودة
      data[targetType][cIdx].pkgs[pIdx] = pkgObj;
    } else {
      // إضافة باقة جديدة
      if(!data[targetType][cIdx].pkgs) data[targetType][cIdx].pkgs = [];
      data[targetType][cIdx].pkgs.push(pkgObj);
    }

    saveAppData(data, true);
    modal.classList.remove("active");
  });

  // حذف باقة فرعية
  window.removePkg = function(type, cIdx, pIdx){
    if(confirm("هل أنت متأكد من حذف هذه الباقة؟")){
      const data = loadAppData();
      data[type][cIdx].pkgs.splice(pIdx, 1);
      saveAppData(data, true);
    }
  };

})();
</script>
</body>
</html>
