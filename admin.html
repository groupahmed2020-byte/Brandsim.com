<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BRAND SIM - لوحة التحكم المحمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background-color:#04101c;
  color:#fff;
  padding:10px;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:linear-gradient(rgba(4,16,28,0.15),rgba(4,16,28,0.3)),url('tower-bg.jpg');
  background-position:center center;
  background-repeat:no-repeat;
  background-size:cover;
}
.main-wrap{
  max-width:480px;
  margin:0 auto;
  border:2px solid #00e5ff;
  border-radius:20px;
  padding:14px 10px;
  background:rgba(4,18,31,0.25);
  box-shadow:0 0 25px rgba(0,229,255,0.3);
}

/* شاشة تسجيل الدخول */
#loginScreen{
  display:flex;
  position:fixed;
  inset:0;
  background:rgba(2,10,18,0.92);
  backdrop-filter:blur(8px);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.login-box{
  width:100%;
  max-width:380px;
  background:radial-gradient(circle at top,#0a273d 0%,#04121f 100%);
  border:2px solid #00e5ff;
  border-radius:20px;
  padding:24px 18px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,229,255,0.4);
}
.login-title{color:#00e5ff;font-size:1.4rem;font-weight:900;margin-bottom:8px}
.login-sub{color:#8ab4c9;font-size:.9rem;font-weight:700;margin-bottom:18px}

#adminPanel{display:none}

.brand-header{text-align:center;margin:8px 0 14px}
.brand-logo{font-size:2.1rem;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px #00e5ff,0 0 24px #00e5ff}
.brand-sub{color:#ffffff;font-size:.9rem;font-weight:700;margin-top:4px;line-height:1.5;text-shadow:0 2px 6px rgba(0,0,0,0.9)}

.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.act-btn{border:1.5px solid rgba(0,229,255,0.5);border-radius:12px;padding:10px 8px;font-weight:800;font-size:.82rem;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(4px);transition:.2s}
.act-btn:active{transform:scale(0.97)}
.btn-gh{grid-column:span 2;background:linear-gradient(90deg,#00e676,#00b0ff);color:#001b29;border:none;font-size:.95rem;padding:12px;box-shadow:0 0 15px rgba(0,230,118,0.4)}
.btn-tok{background:rgba(255,215,64,0.15);color:#ffd740;border-color:#ffd740}
.btn-pass{background:rgba(233,30,99,0.2);color:#ff80ab;border-color:#e91e63}
.btn-dl{background:rgba(255,160,0,0.2);color:#ffca28;border-color:#ffa000}
.btn-view{grid-column:span 2;background:rgba(0,229,255,0.15);color:#00e5ff;border-color:#00e5ff}

.tabs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tab-box{background:rgba(6,27,43,0.45);border:1.5px solid rgba(0,229,255,0.45);border-radius:14px;padding:12px 8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.2s}
.tab-box.active{border-color:#00e5ff;box-shadow:0 0 15px rgba(0,229,255,0.35);background:rgba(8,38,58,0.65)}
.tab-text{font-weight:800;font-size:.95rem;line-height:1.3;text-align:center;flex:1}
.tab-icon{width:34px;height:42px;border:1.5px solid #00e5ff;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,229,255,0.12);font-size:1.1rem}

.section-banner{background:linear-gradient(90deg,rgba(8,54,79,0.55),rgba(6,34,53,0.55));border:1.5px solid #00e5ff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.banner-title{color:#00e5ff;font-size:1.05rem;font-weight:800}
.company-count{border:1.5px solid #00e5ff;border-radius:12px;padding:4px 10px;text-align:center;font-weight:700;font-size:.8rem;color:#fff;background:rgba(0,229,255,0.15)}

.add-bar{background:rgba(6,26,41,0.45);border:1px solid rgba(0,229,255,0.4);border-radius:14px;padding:8px;margin-bottom:14px;display:flex;gap:6px}
.add-bar input{flex:1;background:#041523;border:1px solid rgba(0,229,255,0.35);border-radius:10px;padding:10px 12px;color:#fff;font-size:.9rem;font-weight:600;outline:none}
.add-bar button{background:linear-gradient(180deg,#18c8ff,#0099cc);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap}

.company-card{background:rgba(6,26,41,0.38);border:1px solid rgba(0,229,255,0.4);border-radius:16px;padding:12px 10px;margin-bottom:14px;backdrop-filter:blur(2px)}
.company-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;border-bottom:1px solid rgba(0,229,255,0.2);padding-bottom:8px}
.company-name{font-size:1.05rem;font-weight:800;color:#fff}
.comp-btns{display:flex;gap:6px}
.c-btn{border:none;border-radius:8px;padding:7px 12px;font-weight:800;font-size:.82rem;cursor:pointer;color:#fff}
.c-add{background:#00c853}
.c-edit{background:#fb8c00}
.c-del{background:#e53935}

.pkg-grid{display:grid;grid-template-columns:1fr;gap:10px}
.pkg-box{background:rgba(4,19,31,0.55);border:1.5px solid rgba(0,229,255,0.3);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pkg-info-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.pkg-title{font-weight:800;font-size:.95rem;color:#fff}
.pkg-price{color:#00e5ff;font-size:1.15rem;font-weight:900}

.status-select{
  background:rgba(0,200,83,0.2);
  border:1.5px solid #00c853;
  color:#69f0ae;
  font-size:.85rem;
  font-weight:800;
  padding:6px 12px;
  border-radius:20px;
  outline:none;
  cursor:pointer;
}
.status-select.unavail{
  background:rgba(255,82,82,0.2);
  border-color:#ff5252;
  color:#ff8a80;
}
.status-select option{background:#041523;color:#fff}

.pkg-actions-big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.p-big-btn{border:none;border-radius:10px;padding:10px;font-weight:800;font-size:.9rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-edit-pkg{background:#fb8c00}
.btn-del-pkg{background:#e53935}

#pkgModal{display:none;position:fixed;inset:0;background:rgba(2,10,18,0.85);backdrop-filter:blur(6px);z-index:2000;align-items:center;justify-content:center;padding:14px}
#pkgModal.active{display:flex}
.modal-box{width:100%;max-width:420px;background:radial-gradient(circle at top,#0a273d 0%,#04121f 100%);border:2px solid #00e5ff;border-radius:18px;padding:16px 12px;box-shadow:0 0 28px rgba(0,229,255,0.4)}
.modal-title{color:#00e5ff;font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:12px}
.form-group{margin-bottom:10px;text-align:right}
.form-label{display:block;font-size:.82rem;font-weight:700;color:#8ab4c9;margin-bottom:4px}
.form-input,.form-select{width:100%;background:#041523;border:1px solid rgba(0,229,255,0.35);border-radius:10px;padding:10px 12px;color:#fff;font-size:.95rem;font-weight:600;outline:none}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.btn-save-modal{flex:1;background:linear-gradient(90deg,#00d2ff,#00a8cc);color:#001b29;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:.95rem;cursor:pointer}
.btn-close-modal{background:rgba(255,255,255,0.08);color:#b0cddb;border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}

#toastBox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#062335;border:2px solid #00e676;color:#fff;padding:10px 20px;border-radius:30px;font-weight:800;font-size:.9rem;z-index:9999;transition:.3s;opacity:0;text-align:center}
#toastBox.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول المحمية -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">🔐 لوحة تحكم المشرف</div>
    <div class="login-sub">أدخل كلمة مرور المسؤول للوصول</div>
    <div class="form-group">
      <input type="password" id="adminPasswordInput" class="form-input" placeholder="كلمة المرور..." style="text-align:center;letter-spacing:2px">
    </div>
    <div id="loginError" style="color:#ff5252;font-size:.82rem;font-weight:700;margin-bottom:10px;display:none">⚠️ كلمة المرور غير صحيحة</div>
    <button type="button" class="btn-save-modal" id="loginBtn" style="width:100%">تسجيل الدخول</button>
  </div>
</div>

<!-- نافذة إدارة الباقة -->
<div id="pkgModal">
  <div class="modal-box">
    <div class="modal-title">📦 إدارة الباقة</div>
    <input type="hidden" id="modalCompIdx"><input type="hidden" id="modalPkgIdx">
    <div class="form-group"><label class="form-label">اسم الباقة:</label><input type="text" id="pkgD" class="form-input" placeholder="مثال: باقة شهر"></div>
    <div class="form-group"><label class="form-label">المدة:</label><input type="text" id="pkgS" class="form-input" placeholder="مثال: شهر"></div>
    <div class="form-group"><label class="form-label">السعر (شيكل):</label><input type="number" id="pkgP" class="form-input" placeholder="50"></div>
    <div class="form-group"><label class="form-label">المواصفات (الجيجا):</label><input type="text" id="pkgG" class="form-input" placeholder="مثال: 100 جيجا"></div>
    <div class="form-group"><label class="form-label">الحالة:</label>
      <select id="pkgAvail" class="form-select">
        <option value="true">✅ متوفر</option>
        <option value="false">❌ غير متوفر</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-save-modal" id="savePkgModalBtn">حفظ الباقة</button>
      <button type="button" class="btn-close-modal" id="closeModalBtn">إغلاق</button>
    </div>
  </div>
</div>

<!-- لوحة التحكم الفعلية -->
<div id="adminPanel" class="main-wrap">
  <div class="brand-header">
    <div class="brand-logo">BRAND SIM</div>
    <div class="brand-sub">🛠️ لوحة التحكم وإدارة الباقات والأسعار</div>
  </div>

  <div class="admin-actions">
    <button type="button" class="act-btn btn-gh" id="saveToGhBtn">☁️ حفظ وتحديث في GitHub</button>
    <button type="button" class="act-btn btn-tok" id="setTokenBtn">🔑 رمز GitHub</button>
    <button type="button" class="act-btn btn-pass" id="changePassBtn">🔒 تغيير كلمة السر</button>
    <button type="button" class="act-btn btn-dl" id="downloadJsonBtn">📥 تنزيل data.json</button>
    <a href="index.html" target="_blank" class="act-btn btn-view">🌐 فتح صفحة الموقع الرئيسية</a>
  </div>

  <div class="tabs-grid">
    <div class="tab-box active" id="tabEsimBtn"><div class="tab-text">الشرائح<br>الالكترونية<br>(ESIM)</div><div class="tab-icon">📲</div></div>
    <div class="tab-box" id="tabPlasticBtn"><div class="tab-text">شرائح<br>بلاستيك</div><div class="tab-icon">💳</div></div>
  </div>

  <div class="section-banner">
    <div class="banner-title" id="bannerTitle">📲 الشرائح الالكترونية (ESIM)</div>
    <div class="company-count" id="countBadge">0<br>شركة</div>
  </div>

  <div class="add-bar">
    <input type="text" id="newCompName" placeholder="اسم شركة جديدة...">
    <button type="button" id="addCompBtn">➕ إضافة شركة</button>
  </div>

  <div id="companiesContainer"></div>
</div>

<div id="toastBox">✅ تم الحفظ بنجاح!</div>

<script>
(function(){
  "use strict";

  // نظام حماية كلمة المرور
  const DEFAULT_PASS = "123456";
  const loginScreen = document.getElementById("loginScreen");
  const adminPanel = document.getElementById("adminPanel");
  const passInput = document.getElementById("adminPasswordInput");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");

  function checkLogin(){
    const savedPass = localStorage.getItem("admin_secret_pass") || DEFAULT_PASS;
    if(sessionStorage.getItem("admin_logged_in") === "true"){
      loginScreen.style.display = "none";
      adminPanel.style.display = "block";
      loadData();
    }
  }

  loginBtn.onclick = function(){
    const entered = passInput.value.trim();
    const currentPass = localStorage.getItem("admin_secret_pass") || DEFAULT_PASS;
    if(entered === currentPass){
      sessionStorage.setItem("admin_logged_in", "true");
      loginScreen.style.display = "none";
      adminPanel.style.display = "block";
      loadData();
    } else {
      loginError.style.display = "block";
    }
  };

  passInput.onkeydown = function(e){ if(e.key === "Enter") loginBtn.click(); };

  // زر تغيير كلمة السر من داخل اللوحة
  document.getElementById("changePassBtn").onclick = function(){
    const currentPass = localStorage.getItem("admin_secret_pass") || DEFAULT_PASS;
    const oldP = prompt("أدخل كلمة المرور الحالية:");
    if(oldP === null) return;
    if(oldP.trim() !== currentPass){
      alert("❌ كلمة المرور الحالية غير صحيحة!");
      return;
    }
    const newP = prompt("أدخل كلمة المرور الجديدة:");
    if(!newP || !newP.trim()) return alert("⚠️ لا يمكنเกีย كلمة مرور فارغة!");
    localStorage.setItem("admin_secret_pass", newP.trim());
    alert("✅ تم تغيير كلمة المرور بنجاح!");
  };

  checkLogin();

  const GH_REPO = "groupahmed2020-byte/BrandSim.com", GH_BRANCH = "main", FILE_PATH = "data.json";
  const DEFAULT_FALLBACK = {
    esim: [
      {name:"ألوها (Aloha)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"بارتنر (Partner)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"بيليفون (Pelephone)", pkgs:[{d:"باقة شهر",s:"شهر",p:55,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:140,g:"300 جيجا",available:true}]},
      {name:"سيلكوم (Cellcom)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:135,g:"300 جيجا",available:true}]},
      {name:"هوت موبايل (Hot Mobile)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"جولان تليكوم (Golan)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"019 موبايل (019 Mobile)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"رامي ليفي (Rami Levy)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]},
      {name:"ويكوم (Wecom)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"012 موبايل (012 Mobile)", pkgs:[{d:"باقة شهر",s:"شهر",p:50,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:130,g:"300 جيجا",available:true}]},
      {name:"يوفون (YouPhone)", pkgs:[{d:"باقة شهر",s:"شهر",p:45,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:120,g:"300 جيجا",available:true}]}
    ],
    plastic: [
      {name:"بارتنر بلاستيك (Partner)", pkgs:[{d:"باقة شهرية عادية",s:"شهر",p:55,g:"80 جيجا",available:true},{d:"باقة 3 شهور توفير",s:"3 شهور",p:135,g:"250 جيجا",available:true}]},
      {name:"بيليفون بلاستيك (Pelephone)", pkgs:[{d:"باقة شهرية",s:"شهر",p:60,g:"100 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:150,g:"300 جيجا",available:true}]},
      {name:"سيلكوم بلاستيك (Cellcom)", pkgs:[{d:"باقة شهر",s:"شهر",p:55,g:"90 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:140,g:"270 جيجا",available:true}]},
      {name:"هوت موبايل بلاستيك (Hot)", pkgs:[{d:"باقة اقتصادية شهر",s:"شهر",p:50,g:"80 جيجا",available:true},{d:"باقة 3 شهور",s:"3 شهور",p:125,g:"240 جيجا",available:true}]}
    ]
  };

  let appData = DEFAULT_FALLBACK, currentTab = "esim";

  function showToast(text, isError = false){
    const t = document.getElementById("toastBox");
    t.textContent = text;
    t.style.borderColor = isError ? "#ff5252" : "#00e676";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 4000);
  }

  function toBase64(str){
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for(let i=0; i<bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function fromBase64(b64){
    const bin = atob(b64.replace(/\s/g, ""));
    const bytes = new Uint8Array(bin.length);
    for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  async function loadData(){
    const localSaved = localStorage.getItem("brand_local_cache");
    if(localSaved){ try{ appData = JSON.parse(localSaved); render(); }catch(e){} }
    const token = localStorage.getItem("my_secret_token");
    if(token){
      try {
        const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${FILE_PATH}?ref=${GH_BRANCH}&t=${Date.now()}`, {
          cache: "no-store", headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
        });
        if(r.ok){
          const d = await r.json();
          appData = JSON.parse(fromBase64(d.content));
          localStorage.setItem("brand_local_cache", JSON.stringify(appData));
          render(); return;
        }
      } catch(e){}
    }
    if(!localSaved){
      try {
        const r = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
        if(r.ok){ appData = await r.json(); localStorage.setItem("brand_local_cache", JSON.stringify(appData)); }
      } catch(e){}
    }
    render();
  }

  async function saveChanges(){
    localStorage.setItem("brand_local_cache", JSON.stringify(appData));
    render();
    await commitToGitHub();
  }

  async function commitToGitHub(){
    let token = localStorage.getItem("my_secret_token");
    if(!token){
      token = prompt("أدخل رمز GitHub Token للحفظ في المستودع:");
      if(!token || !token.trim()){ showToast("⚠️ حُفظ في الهاتف فقط (أدخل رمز GitHub)", true); return; }
      token = token.trim();
      localStorage.setItem("my_secret_token", token);
    }
    const btn = document.getElementById("saveToGhBtn");
    btn.textContent = "⏳ جاري الحفظ في GitHub..."; btn.disabled = true;
    try {
      const info = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${FILE_PATH}?ref=${GH_BRANCH}&t=${Date.now()}`, {
        cache: "no-store", headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
      });
      let sha;
      if(info.ok){ sha = (await info.json()).sha; }
      else if(info.status === 401 || info.status === 403){
        localStorage.removeItem("my_secret_token");
        throw new Error("رمز GitHub غير صالح أو لا يملك صلاحية repo.");
      }
      const payload = { message: "تحديث الباقات عبر لوحة التحكم", content: toBase64(JSON.stringify(appData, null, 2)), branch: GH_BRANCH };
      if(sha) payload.sha = sha;
      const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${FILE_PATH}`, {
        method: "PUT", cache: "no-store",
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error((await res.json().catch(()=>({}))).message || "فشل الرفع إلى GitHub");
      showToast("🚀 تم الحفظ والتحديث في GitHub بنجاح!");
    } catch(e) {
      alert("❌ خطأ GitHub:\n" + e.message);
      showToast("⚠️ تم الحفظ على الهاتف فقط", true);
    } finally {
      btn.textContent = "☁️ حفظ وتحديث في GitHub"; btn.disabled = false;
    }
  }

  document.getElementById("setTokenBtn").onclick = () => {
    const inp = prompt("أدخل رمز GitHub Token الجديد (أو اتركه فارغاً للحذف):", localStorage.getItem("my_secret_token") || "");
    if(inp === null) return;
        if(!inp.trim()){ localStorage.removeItem("my_secret_token"); showToast("🗑️ تم حذف الرمز"); }
    else { localStorage.setItem("my_secret_token", inp.trim()); showToast("🔑 تم حفظ الرمز بنجاح!"); }
  };

  document.getElementById("downloadJsonBtn").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" }));
    a.download = "data.json"; a.click();
    showToast("📥 تم تنزيل data.json");
  };

  document.getElementById("saveToGhBtn").onclick = commitToGitHub;

  document.getElementById("tabEsimBtn").onclick = function(){
    currentTab = "esim";
    this.classList.add("active");
    document.getElementById("tabPlasticBtn").classList.remove("active");
    document.getElementById("bannerTitle").textContent = "📲 الشرائح الالكترونية (ESIM)";
    render();
  };

  document.getElementById("tabPlasticBtn").onclick = function(){
    currentTab = "plastic";
    this.classList.add("active");
    document.getElementById("tabEsimBtn").classList.remove("active");
    document.getElementById("bannerTitle").textContent = "💳 شرائح بلاستيك";
    render();
  };

  document.getElementById("addCompBtn").onclick = () => {
    const val = document.getElementById("newCompName").value.trim();
    if(!val) return alert("أدخل اسم الشركة أولاً!");
    (appData[currentTab] = appData[currentTab] || []).push({ name: val, pkgs: [] });
    document.getElementById("newCompName").value = "";
    saveChanges();
  };

  function render(){
    const list = appData[currentTab] || [];
    document.getElementById("countBadge").innerHTML = list.length + "<br>شركة";
    const container = document.getElementById("companiesContainer");
    container.innerHTML = list.map((comp, cIdx) => `
      <div class="company-card">
        <div class="company-head">
          <div class="company-name">📌 ${comp.name}</div>
          <div class="comp-btns">
            <button class="c-btn c-add" onclick="openModal(${cIdx})">➕ باقة</button>
            <button class="c-btn c-edit" onclick="editComp(${cIdx})">✏️ تعديل</button>
            <button class="c-btn c-del" onclick="delComp(${cIdx})">🗑️ حذف</button>
          </div>
        </div>
        <div class="pkg-grid">
          ${(comp.pkgs || []).map((pkg, pIdx) => {
            const av = pkg.available !== false;
            return `
            <div class="pkg-box">
              <div class="pkg-info-row">
                <span class="pkg-title">${pkg.d} (${pkg.s} - ${pkg.g})</span>
                <span class="pkg-price">${pkg.p} ₪</span>
              </div>
              <div class="pkg-info-row" style="margin-top:2px">
                <select class="status-select ${av ? '' : 'unavail'}" onchange="changePkgStatus(${cIdx}, ${pIdx}, this.value)">
                  <option value="true" ${av ? 'selected' : ''}>✅ متوفر</option>
                  <option value="false" ${!av ? 'selected' : ''}>❌ غير متوفر</option>
                </select>
                <div style="font-size:.78rem;color:#8ab4c9">اضغط لتغيير الحالة</div>
              </div>
              <div class="pkg-actions-big">
                <button class="p-big-btn btn-edit-pkg" onclick="openModal(${cIdx},${pIdx})">✏️ تعديل الباقة</button>
                <button class="p-big-btn btn-del-pkg" onclick="delPkg(${cIdx},${pIdx})">🗑️ حذف الباقة</button>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>`).join("");
  }

  window.changePkgStatus = (cIdx, pIdx, val) => {
    appData[currentTab][cIdx].pkgs[pIdx].available = (val === "true");
    saveChanges();
  };

  window.editComp = idx => { const n = prompt("تعديل اسم الشركة:", appData[currentTab][idx].name); if(n && n.trim()){ appData[currentTab][idx].name = n.trim(); saveChanges(); } };
  window.delComp = idx => { if(confirm("حذف الشركة بالكامل؟")){ appData[currentTab].splice(idx, 1); saveChanges(); } };
  window.delPkg = (cIdx, pIdx) => { if(confirm("حذف هذه الباقة؟")){ appData[currentTab][cIdx].pkgs.splice(pIdx, 1); saveChanges(); } };

  const modal = document.getElementById("pkgModal");
  window.openModal = (cIdx, pIdx = null) => {
    document.getElementById("modalCompIdx").value = cIdx;
    document.getElementById("modalPkgIdx").value = pIdx !== null ? pIdx : "";
    const pkg = pIdx !== null ? appData[currentTab][cIdx].pkgs[pIdx] : { d:"", s:"", p:"", g:"", available:true };
    document.getElementById("pkgD").value = pkg.d;
    document.getElementById("pkgS").value = pkg.s;
    document.getElementById("pkgP").value = pkg.p;
    document.getElementById("pkgG").value = pkg.g;
    document.getElementById("pkgAvail").value = (pkg.available !== false).toString();
    modal.classList.add("active");
  };

  document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("active");
  document.getElementById("savePkgModalBtn").onclick = () => {
    const cIdx = document.getElementById("modalCompIdx").value, pIdx = document.getElementById("modalPkgIdx").value;
    const d = document.getElementById("pkgD").value.trim(), s = document.getElementById("pkgS").value.trim();
    const p = parseFloat(document.getElementById("pkgP").value), g = document.getElementById("pkgG").value.trim();
    const available = document.getElementById("pkgAvail").value === "true";
    if(!d || !s || isNaN(p)) return alert("يرجى إدخال البيانات بشكل صحيح!");
    if(pIdx !== "") appData[currentTab][cIdx].pkgs[pIdx] = { d, s, p, g, available };
    else (appData[currentTab][cIdx].pkgs = appData[currentTab][cIdx].pkgs || []).push({ d, s, p, g, available });
    modal.classList.remove("active");
    saveChanges();
  };
})();
</script>
</body>
</html>
