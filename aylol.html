<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث رقم الهاتف - أيلول</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #001f3f; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 40px auto;
            background: rgba(3, 27, 62, 0.75);
            padding: 30px;
            border-radius: 14px;
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        input { 
            width: 100%; 
            box-sizing: border-box;
            padding: 14px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            border: 1.5px solid #00d2ff; 
            background: rgba(3, 26, 60, 0.85); 
            color: #ffffff;
            font-size: 16px;
            text-align: left;
            direction: ltr;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(90deg, #0080ff 0%, #00d2ff 100%); 
            color: #ffffff; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #alertMsg { 
            margin-top: 15px; 
            font-size: 14px;
            line-height: 1.6;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تحديث رقم الهاتف</h2>
        <p>أدخل الرقم الجديد لتحديث البيانات في النظام</p>
        
        <input type="tel" id="phoneInput" placeholder="05xxxxxxxx" maxlength="15">
        <button id="submitBtn" onclick="sendUpdate()">تحديث الرقم الآن</button>
        
        <div id="alertMsg"></div>
    </div>

    <script>
        function sendUpdate() {
            var phoneInput = document.getElementById('phoneInput');
            var alertMsg = document.getElementById('alertMsg');
            var btn = document.getElementById('submitBtn');
            var phone = phoneInput.value.trim();

            if (phone === '') {
                showAlert('الرجاء إدخال رقم الهاتف', '#f87171', 'rgba(239, 68, 68, 0.15)');
                return;
            }

            var cleanPhone = phone.replace(/[^0-9]/g, '');
            if (cleanPhone.length < 5) {
                showAlert('رقم الهاتف قصير جداً', '#f87171', 'rgba(239, 68, 68, 0.15)');
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري إرسال التحديث...";
            showAlert('جاري معالجة الطلب...', '#38bdf8', 'rgba(56, 189, 248, 0.15)');

            var formData = new URLSearchParams();
            formData.append('phone', cleanPhone);

            // رابط ملف الوسيط على استضافتك
            var proxyUrl = 'https://aylol-api.infinityfreeapp.com/proxy.php';

            fetch(proxyUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                btn.disabled = false;
                btn.innerText = "تحديث الرقم الآن";

                if (data && data.success) {
                    showAlert(data.message || 'تم إرسال طلب التحديث بنجاح', '#34d399', 'rgba(16, 185, 129, 0.15)');
                    phoneInput.value = '';
                } else {
                    showAlert(data && data.message ? data.message : 'فشلت العملية', '#f87171', 'rgba(239, 68, 68, 0.15)');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.innerText = "تحديث الرقم الآن";
                showAlert('حدث خطأ أثناء الاتصال بالخادم. حاول مرة أخرى.', '#f87171', 'rgba(239, 68, 68, 0.15)');
            });
        }

        function showAlert(text, color, bgColor) {
            var el = document.getElementById('alertMsg');
            el.style.display = 'block';
            el.innerText = text;
            el.style.color = color;
            el.style.backgroundColor = bgColor;
        }
    </script>
</body>
</html>
