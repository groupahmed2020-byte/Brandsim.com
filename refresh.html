<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#04101c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<title>BRAND SIM | تحديث وتنشيط الشرائح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden !important;
  background-color: #04101c;
  color: #fff;
}
html {
  height: 100%;
  direction: ltr;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  overflow-y: auto;
  position: relative;
  overscroll-behavior-y: contain;
  margin: 0 auto;
}
body[lang="he"] * {
  font-family: 'Rubik', sans-serif;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100lvh;
  z-index: -1;
  background-image: linear-gradient(rgba(4, 16, 28, 0.22), rgba(4, 16, 28, 0.42)), url('tower-bg.jpg'), url('1000046718.jpg');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;
  pointer-events: none;
}
.card {
  direction: rtl;
  width: 100%;
  max-width: 440px;
  margin: auto;
  border: 2px solid #00e5ff;
  border-radius: 22px;
  padding: 24px 18px 20px;
  background: rgba(4, 18, 31, 0.52);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.logo-wrapper {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 12px;
  direction: ltr;
}
.logo-icon {
  background: rgba(0, 229, 255, 0.15);
  border: 1.5px solid #00e5ff;
  color: #00e5ff;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
  flex-shrink: 0;
}
.logo-icon i {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
}
.logo-text {
  font-size: clamp(1.65rem, 6vw, 2.05rem);
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 12px #00e5ff, 0 0 24px #00e5ff;
  white-space: nowrap;
}
.welcome-title {
  font-size: clamp(1.15rem, 4.5vw, 1.35rem);
  font-weight: 800;
  margin-bottom: 6px;
  color: #00e5ff;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
}
.subtitle {
  font-size: clamp(0.84rem, 3.4vw, 0.95rem);
  color: #e2f4fc;
  margin-bottom: 20px;
  line-height: 1.55;
  font-weight: 700;
  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
}
.form-group {
  text-align: right;
  margin-bottom: 16px;
  position: relative;
}
.form-group label {
  display: block;
  font-weight: 800;
  font-size: 0.92rem;
  margin-bottom: 8px;
  color: #00e5ff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
}
.form-control {
  width: 100%;
  min-height: 52px;
  padding: 12px 16px;
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  border: 1.5px solid rgba(0, 229, 255, 0.5);
  border-radius: 12px;
  text-align: center;
  direction: ltr;
  color: #fff;
  background: rgba(4, 21, 35, 0.82);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  appearance: none;
  -webkit-appearance: none;
}
.form-control::placeholder {
  color: rgba(194, 226, 242, 0.48);
}
.form-control:focus {
  border-color: #00e5ff;
  background: rgba(4, 21, 35, 0.95);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
}
.btn-submit {
  width: 100%;
  min-height: 52px;
  padding: 13px;
  font-size: 1.05rem;
  font-weight: 800;
  color: #001b29;
  background: linear-gradient(90deg, #00e5ff, #00a8cc);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.45);
  touch-action: manipulation;
  user-select: none;
}
.btn-submit:active {
  transform: scale(0.98);
}
.btn-submit:disabled {
  background: rgba(148, 163, 184, 0.4);
  color: #cbd5e1;
  cursor: not-allowed;
  box-shadow: none;
}
.spinner {
  display: none;
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
}
.btn-submit.loading .spinner {
  display: inline-block;
}
.alert-box {
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  line-height: 1.6;
  word-break: break-word;
  white-space: pre-line;
  background: rgba(6, 35, 53, 0.92);
}
.alert-box i {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
}
.alert-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
}
.alert-box.success {
  display: flex;
  color: #69f0ae;
  border: 1.5px solid #00c853;
  box-shadow: 0 0 12px rgba(0, 200, 83, 0.25);
}
.alert-box.warning {
  display: flex;
  color: #ffd740;
  border: 1.5px solid #ffab00;
  box-shadow: 0 0 12px rgba(255, 171, 0, 0.25);
}
.alert-box.error {
  display: flex;
  color: #ff5252;
  border: 1.5px solid #ff1744;
  box-shadow: 0 0 12px rgba(255, 23, 68, 0.25);
}
.footer-bar {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid rgba(0, 229, 255, 0.25);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.lang-btn {
  color: #00e5ff;
  background: rgba(0, 229, 255, 0.12);
  font-weight: 800;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid #00e5ff;
  transition: 0.2s;
  user-select: none;
  touch-action: manipulation;
}
.lang-btn:active,
.lang-btn:hover {
  background: #00e5ff;
  color: #001b29;
  box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
}
.copyright {
  color: #c2e2f2;
  font-size: 0.82rem;
  font-weight: 700;
  direction: ltr;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  white-space: nowrap;
}
</style>
</head>
<body lang="ar">
<div class="card">
  <div class="logo-wrapper">
    <div class="logo-icon"><i class="fas fa-sim-card"></i></div>
    <div class="logo-text">BRAND SIM</div>
  </div>
  <h2 class="welcome-title" id="ui-welcome">مرحباً بك في براند سيم</h2>
  <p class="subtitle" id="ui-subtitle">أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة</p>
  <form id="customer-refresh-number-form" novalidate>
    <div class="form-group">
      <label for="customerPhone" id="ui-label">📱 رقم الهاتف:</label>
      <input
        type="tel"
        id="customerPhone"
        class="form-control"
        placeholder="05XXXXXXXX"
        maxlength="16"
        inputmode="numeric"
        pattern="[0-9]*"
        enterkeyhint="send"
        autocomplete="tel"
        dir="ltr"
        required
      >
    </div>
    <button type="submit" id="customSubmitBtn" class="btn-submit">
      <span id="ui-btn">تحديث الرقم الآن</span>
      <i class="fas fa-sync-alt fa-spin spinner"></i>
    </button>
  </form>
  <div id="alertBox" class="alert-box" role="alert"></div>
  <div class="footer-bar">
    <button type="button" class="lang-btn" id="langToggleBtn">עברית</button>
    <span class="copyright">BRAND SIM © <span id="yearSpan">2026</span></span>
  </div>
</div>

<script>
(function() {
  "use strict";
  document.getElementById("yearSpan").textContent = new Date().getFullYear();

  const GATEWAY_API_URL = "https://script.google.com/macros/s/AKfycbxpvDw2RXxnPflfrPHIgki51Qovtk9BS7p30tK8aoBIUXD6Hqs6SDsnxMYMX9AJo6OP/exec";
  const CUSTOMERS_DB_URLS = [
    "https://incredible-crumble-58566c.netlify.app/customers.json",
    "customers.json"
  ];

  const i18n = {
    ar: {
      welcome: "مرحباً بك في براند سيم",
      subtitle: "أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة",
      label: "📱 رقم الهاتف:",
      placeholder: "05XXXXXXXX",
      btn: "تحديث الرقم الآن",
      loading: "جاري الفحص والتحديث...",
      switchBtn: "עברית",
      invalidPhone: "يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05",
      defaultSuccess: "تم إرسال طلب تحديث وتنشيط الرقم بنجاح!",
      defaultError: "تعذر الاتصال بالخادم، يرجى المحاولة مرة أخرى."
    },
    he: {
      welcome: "ברוך הבא ל-BRAND SIM",
      subtitle: "נא להזין מספר טלפון כדי לבצע רענון והפעלה לכרטיס ה-SIM",
      label: "📱 מספר טלפון:",
      placeholder: "05XXXXXXXX",
      btn: "רענון מספר כעת",
      loading: "בודק ומרענן...",
      switchBtn: "العربية",
      invalidPhone: "נא להזין מספר טלפון תקין בן 10 ספרות המתחיל ב-05",
      defaultSuccess: "המספר רוענן בהצלחה!",
      defaultError: "שגיאת תקשורת, נסה שוב."
    }
  };

  let currentLang = "ar";
  try { if (localStorage.getItem("language") === "he") currentLang = "he"; } catch (e) {}
  let isRefreshing = false;

  const form = document.getElementById("customer-refresh-number-form");
  const phoneInput = document.getElementById("customerPhone");
  const submitBtn = document.getElementById("customSubmitBtn");
  const btnText = document.getElementById("ui-btn");
  const alertBox = document.getElementById("alertBox");
  const langBtn = document.getElementById("langToggleBtn");

  function cleanText(s) {
    return String(s || "")
      .replace(/[\u0000-\u001F\u007F-\u009F<>]/g, "")
      .replace(/^[⚠️✅❌⚡⏳\s]+/u, "")
      .trim()
      .slice(0, 350);
  }

  function showMessage(type, text) {
    const validType = ["success", "warning", "error"].indexOf(type) !== -1 ? type : "error";
    alertBox.className = "alert-box " + validType;
    alertBox.textContent = "";

    const row = document.createElement("div");
    row.className = "alert-row";

    const icon = document.createElement("i");
    icon.className = "fas " + (validType === "success" ? "fa-check-circle" : validType === "warning" ? "fa-exclamation-triangle" : "fa-times-circle");
    const span = document.createElement("span");
    span.textContent = cleanText(text);

    row.append(icon, span);
    alertBox.appendChild(row);
    alertBox.style.display = "flex";
  }

  function applyLanguage(lang) {
    currentLang = lang === "he" ? "he" : "ar";
    try { localStorage.setItem("language", currentLang); } catch (e) {}
    const t = i18n[currentLang];
    document.body.setAttribute("lang", currentLang);
    document.getElementById("ui-welcome").textContent = t.welcome;
    document.getElementById("ui-subtitle").textContent = t.subtitle;
    document.getElementById("ui-label").textContent = t.label;
    phoneInput.placeholder = t.placeholder;
    btnText.textContent = t.btn;
    langBtn.textContent = t.switchBtn;
  }

  function normalizePhoneNumber(rawInput) {
    if (!rawInput) return "";
    let str = String(rawInput)
      .replace(/[٠-٩]/g, function(d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
      .replace(/[۰-۹]/g, function(d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); });
    if (str.indexOf("_") !== -1) str = str.split("_")[0];
    str = str.replace(/[^0-9]/g, "");
    if (str.indexOf("00972") === 0 || str.indexOf("00970") === 0) str = "0" + str.slice(5);
    else if ((str.indexOf("972") === 0 || str.indexOf("970") === 0) && str.length >= 11) str = "0" + str.slice(3);
    else if (str.length === 9 && str.indexOf("5") === 0) str = "0" + str;
    if (str.length > 10 && str.indexOf("05") === 0) str = str.slice(0, 10);
    return str;
  }

  async function lookupCustomerProvider(phone) {
    for (let u = 0; u < CUSTOMERS_DB_URLS.length; u++) {
      try {
        const res = await fetch(CUSTOMERS_DB_URLS[u] + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) continue;
        const parsed = await res.json();
        const list = Array.isArray(parsed) ? parsed : (parsed.customers || parsed.data || []);
        if (Array.isArray(list)) {
          for (let i = 0; i < list.length; i++) {
            const item = list[i];
            if (normalizePhoneNumber(item.simPhone || item.phone || item.number || "") === phone) {
              return item.source || item.subCompany || item.provider || "";
            }
          }
        }
      } catch (e) {}
    }
    return "";
  }

  async function executeRefresh(rawNumber) {
    if (isRefreshing) return;
    const t = i18n[currentLang];
    const cleanNumber = normalizePhoneNumber(rawNumber);
    phoneInput.value = cleanNumber;

    if (!/^05\d{8}$/.test(cleanNumber)) {
      showMessage("warning", t.invalidPhone);
      return;
    }

    try { phoneInput.blur(); } catch (e) {}

    isRefreshing = true;
    submitBtn.disabled = true;
    submitBtn.classList.add("loading");
    btnText.textContent = t.loading;
    alertBox.style.display = "none";

    try {
      const detectedProvider = await lookupCustomerProvider(cleanNumber);
      const res = await fetch(GATEWAY_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          phone: cleanNumber,
          provider: detectedProvider,
          lang: currentLang
        }),
        redirect: "follow"
      });
      const data = await res.json();

      const rawMsg = (data && data.msg) ? data.msg : ((data && data.ok) ? t.defaultSuccess : t.defaultError);
      const finalMsg = cleanText(rawMsg);
      if (data && data.ok) {
        showMessage("success", finalMsg);
        phoneInput.value = "";
      } else {
        showMessage((data && data.type) ? data.type : "warning", finalMsg);
      }
    } catch (e) {
      showMessage("error", t.defaultError);
    } finally {
      isRefreshing = false;
      submitBtn.disabled = false;
      submitBtn.classList.remove("loading");
      btnText.textContent = t.btn;
    }
  }

  phoneInput.addEventListener("input", function(e) {
    const n = normalizePhoneNumber(e.target.value);
    if (e.target.value !== n) e.target.value = n;
  });

  phoneInput.addEventListener("paste", function(e) {
    try {
      const pasted = (e.clipboardData || window.clipboardData).getData("text");
      if (pasted) {
        e.preventDefault();
        phoneInput.value = normalizePhoneNumber(pasted);
      }
    } catch (err) {}
  });

  langBtn.addEventListener("click", function() {
    alertBox.style.display = "none";
    applyLanguage(currentLang === "ar" ? "he" : "ar");
  });

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    executeRefresh(phoneInput.value);
  });

  submitBtn.addEventListener("click", function(e) {
    if (e.target === submitBtn || submitBtn.contains(e.target)) {
      e.preventDefault();
      executeRefresh(phoneInput.value);
    }
  });

  window.addEventListener("DOMContentLoaded", function() {
    const p = new URLSearchParams(window.location.search);
    applyLanguage(p.get("lang") || currentLang);
    const num = p.get("number") || p.get("phone");
    if (num) phoneInput.value = normalizePhoneNumber(num);
  });
})();
</script>
</body>
</html>
