<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; img-src * data: blob:; style-src * 'unsafe-inline'; font-src * data:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src *;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<title>BRAND SIM | تحديث وتنشيط الشرائح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background-color:#04101c;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px;overflow-x:hidden;position:relative}
body[lang="he"]{font-family:'Rubik',sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(4,16,28,0.18),rgba(4,16,28,0.35)),url('tower-bg.jpg'),url('1000046718.jpg');background-position:center center;background-repeat:no-repeat;background-size:cover}
.card{width:100%;max-width:460px;border:2px solid #00e5ff;border-radius:22px;padding:28px 20px 22px;background:rgba(4,18,31,0.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);box-shadow:0 0 25px rgba(0,229,255,0.35);text-align:center;position:relative}
.logo-wrapper{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;direction:ltr}
.logo-icon{background:rgba(0,229,255,0.15);border:1.5px solid #00e5ff;color:#00e5ff;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 12px rgba(0,229,255,0.35)}
.logo-text{font-size:2.1rem;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px #00e5ff,0 0 24px #00e5ff}
.welcome-title{font-size:1.35rem;font-weight:800;margin-bottom:6px;color:#00e5ff;text-shadow:0 2px 6px rgba(0,0,0,0.9)}
.subtitle{font-size:.95rem;color:#e2f4fc;margin-bottom:22px;line-height:1.6;font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,0.9)}
.form-group{text-align:right;margin-bottom:18px}
body[lang="he"] .form-group{text-align:right}
.form-group label{display:block;font-weight:800;font-size:.92rem;margin-bottom:8px;color:#00e5ff;text-shadow:0 1px 4px rgba(0,0,0,0.9)}
.form-control{width:100%;padding:13px 16px;font-size:1.25rem;font-weight:800;letter-spacing:1.5px;border:1.5px solid rgba(0,229,255,0.45);border-radius:12px;text-align:center;direction:ltr;color:#fff;background:rgba(4,21,35,0.75);outline:none;transition:.2s}
.form-control::placeholder{color:rgba(194,226,242,0.5)}
.form-control:focus{border-color:#00e5ff;background:rgba(4,21,35,0.9);box-shadow:0 0 12px rgba(0,229,255,0.4)}
.btn-submit{width:100%;padding:13px;font-size:1.05rem;font-weight:800;color:#001b29;background:linear-gradient(90deg,#00e5ff,#00a8cc);border:none;border-radius:12px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 15px rgba(0,229,255,0.45)}
.btn-submit:active{transform:scale(0.98)}
.btn-submit:disabled{background:rgba(148,163,184,0.4);color:#cbd5e1;cursor:not-allowed;box-shadow:none}
.spinner{display:none}
.btn-submit.loading .spinner{display:inline-block}
.alert-box{margin-top:18px;padding:12px 14px;border-radius:12px;font-size:.9rem;font-weight:700;display:none;align-items:center;justify-content:center;gap:10px;line-height:1.6;word-break:break-word;background:rgba(6,35,53,0.85)}
.alert-box.success{display:flex;color:#69f0ae;border:1.5px solid #00c853;box-shadow:0 0 12px rgba(0,200,83,0.25)}
.alert-box.warning{display:flex;color:#ffd740;border:1.5px solid #ffab00;box-shadow:0 0 12px rgba(255,171,0,0.25)}
.alert-box.error{display:flex;color:#ff5252;border:1.5px solid #ff1744;box-shadow:0 0 12px rgba(255,23,68,0.25)}
.footer-bar{margin-top:24px;padding-top:14px;border-top:1px solid rgba(0,229,255,0.25);display:flex;justify-content:space-between;align-items:center}
.lang-btn{color:#00e5ff;background:rgba(0,229,255,0.1);font-weight:800;font-size:.85rem;cursor:pointer;padding:5px 16px;border-radius:20px;border:1.5px solid #00e5ff;transition:.2s;user-select:none}
.lang-btn:hover{background:#00e5ff;color:#001b29;box-shadow:0 0 10px rgba(0,229,255,0.5)}
.copyright{color:#c2e2f2;font-size:.85rem;font-weight:700;direction:ltr;text-shadow:0 1px 3px rgba(0,0,0,0.9)}
</style>
</head>
<body lang="ar">
<div class="card">
  <div class="logo-wrapper"><div class="logo-icon"><i class="fas fa-sim-card"></i></div><div class="logo-text">BRAND SIM</div></div>
  <h2 class="welcome-title" id="ui-welcome">مرحباً بك في براند سيم</h2>
  <p class="subtitle" id="ui-subtitle">أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة</p>
  <form id="customer-refresh-number-form" novalidate>
    <div class="form-group"><label for="customerPhone" id="ui-label">📱 رقم الهاتف:</label><input type="tel" id="customerPhone" class="form-control" placeholder="05XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="tel" required></div>
    <button type="submit" id="customSubmitBtn" class="btn-submit"><span id="ui-btn">تحديث الرقم الآن</span><i class="fas fa-sync-alt fa-spin spinner"></i></button>
  </form>
  <div id="alertBox" class="alert-box" role="alert"></div>
  <div class="footer-bar"><button type="button" class="lang-btn" id="langToggleBtn">עברית</button><span class="copyright">BRAND SIM © <span id="yearSpan"></span></span></div>
</div>
<script>
(function(){"use strict";
if(window.top!==window.self){try{window.top.location=window.self.location;}catch(e){}}
document.getElementById("yearSpan").textContent=new Date().getFullYear();

const SKY_TELEGRAM_WORKER_URL="https://gentle-morning-4759.groupahmed2020.workers.dev/";
const LAYAN_API_URL="https://api.layan-t.net/api/Subscribtions/CustomersRefreshNumber";
const AREEN_GAS_URL="https://script.google.com/macros/s/AKfycbxidpoKH8PnhxSvKggQpI2K2BiQQLm7PJM2byXFxnJY1f2Iahqj4UdRfYFuECuqqoPK/exec";
const QUICKLINE_GAS_URL="https://script.google.com/macros/s/AKfycbzoFY7vXfDNsMBieM33Ohym4o3oif6_hoc1FI0RFzKbEgvfALOVMBWQKNt14VOakcQg/exec";
const AYLOL_WORKER_URL="https://steep-shadow-66a0.groupahmed2020.workers.dev/";
const NETLIFY_QUERY_URL="https://incredible-crumble-58566c.netlify.app/.netlify/functions/query";

const i18n=Object.freeze({
  ar:Object.freeze({welcome:"مرحباً بك في براند سيم",subtitle:"أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة",label:"📱 رقم الهاتف:",placeholder:"05XXXXXXXX",btn:"تحديث الرقم الآن",loading:"جاري الفحص والتحديث...",switchBtn:"עברית",invalidPhone:"يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05",notAuthorized:"عذراً، هذا الرقم غير مسجل في منظومة براند سيم (BRAND SIM) ولا يمكن تحديثه.",skyExpired:"الرقم منتهي اشتراكه، الرجاء التواصل مع المندوب من أجل التجديد",defaultSuccess:"✅ تم إرسال طلب تحديث وتنشيط الرقم بنجاح!",defaultError:"⚠️ تعذر تحديث الرقم حالياً، يرجى التأكد من الرقم أو المحاولة لاحقاً."}),
  he:Object.freeze({welcome:"ברוך הבא ל-BRAND SIM",subtitle:"נא להזין מספר טלפון כדי לבצע רענון והפעלה לכרטיס ה-SIM",label:"📱 מספר טלפון:",placeholder:"05XXXXXXXX",btn:"רענון מספר כעת",loading:"בודק ומרענן...",switchBtn:"العربية",invalidPhone:"נא להזין מספר טלפון תקין בן 10 ספרות המתחיל ב-05",notAuthorized:"מספר זה אינו רשום במערכת BRAND SIM ולא ניתן לרענן אותו.",skyExpired:"الرقم منتهي اشتراكه، الرجاء التواصل مع المندوب من أجل التجديد",defaultSuccess:"✅ המספר רוענן בהצלחה!",defaultError:"⚠️ פעולת הרענון נכשלה, בדוק את המספר או נסה שוב."})
});

let currentLang=localStorage.getItem("language")==="he"?"he":"ar";
let isRefreshing=false;
let lastSubmit=0;
let lastSkySentPhone="";
let lastSkySentTime=0;

const form=document.getElementById("customer-refresh-number-form"),phoneInput=document.getElementById("customerPhone"),submitBtn=document.getElementById("customSubmitBtn"),btnText=document.getElementById("ui-btn"),alertBox=document.getElementById("alertBox"),langBtn=document.getElementById("langToggleBtn");

function cleanText(s){return String(s||"").replace(/[\u0000-\u001F\u007F-\u009F<>]/g,"").trim().slice(0,220);}

function applyLanguage(lang){
  currentLang=lang==="he"?"he":"ar";try{localStorage.setItem("language",currentLang);}catch(e){}
  const t=i18n[currentLang];document.body.setAttribute("lang",currentLang);
  document.getElementById("ui-welcome").textContent=t.welcome;document.getElementById("ui-subtitle").textContent=t.subtitle;
  document.getElementById("ui-label").textContent=t.label;phoneInput.placeholder=t.placeholder;
  btnText.textContent=t.btn;langBtn.textContent=t.switchBtn;
}

function normalizePhoneNumber(rawInput){
  if(!rawInput)return"";
  let str=String(rawInput).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  if(str.includes("_"))str=str.split("_")[0];str=str.replace(/[^0-9]/g,"");
  if(str.startsWith("00972")||str.startsWith("00970"))str="0"+str.slice(5);
  else if((str.startsWith("972")||str.startsWith("970"))&&str.length>=11)str="0"+str.slice(3);
  else if(str.length===9&&str.startsWith("5"))str="0"+str;
  else if(str.length>10&&str.startsWith("05"))str=str.slice(0,10);
  return str;
}

function isSubscriptionExpired(expStr){
  if(!expStr)return false;
  const s=String(expStr).trim();
  if(s==="موصول"||s==="-")return false;
  const now=new Date();now.setHours(0,0,0,0);
  const ex=new Date(s);
  if(isNaN(ex.getTime()))return false;
  ex.setHours(0,0,0,0);
  const diffDays=Math.ceil((ex-now)/86400000);
  return diffDays<0;
}

function showMessage(type,text){
  const validType=["success","warning","error"].includes(type)?type:"error";
  alertBox.className="alert-box "+validType;alertBox.textContent="";
  const icon=document.createElement("i");icon.className="fas "+(validType==="success"?"fa-check-circle":validType==="warning"?"fa-exclamation-triangle":"fa-times-circle");
  const span=document.createElement("span");span.textContent=cleanText(text);
  alertBox.append(icon,span);alertBox.style.display="flex";
}
window.showMessage=showMessage;

async function findCustomerInBackend(cleanPhone){
  try{
    const res=await fetch(NETLIFY_QUERY_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({phone:cleanPhone})
    });
    const json=await res.json();
    if(res.ok&&json.ok&&json.data)return json.data;
  }catch(e){}
  try{
    const localRes=await fetch("https://incredible-crumble-58566c.netlify.app/custom.json?t="+Date.now());
    if(localRes.ok){
      const data=await localRes.json();
      const list=Array.isArray(data)?data:(data.customers||data.data||[]);
      if(Array.isArray(list)){
        const found=list.find(c=>normalizePhoneNumber(c.simPhone||c.phone||c.number)===cleanPhone);
        if(found)return found;
      }
    }
  }catch(e){}
  return null;
}

async function sendToTelegramOnce(cmdText){
  const workerUrl=`${SKY_TELEGRAM_WORKER_URL}?text=${encodeURIComponent(cmdText)}`;
  
  try{
    const res=await fetch(workerUrl,{method:"GET"});
    if(res&&res.ok)return true;
  }catch(e){}

  try{
    await fetch(workerUrl,{method:"GET",mode:"no-cors",cache:"no-store"});
    return true;
  }catch(e){}

  return false;
}

async function refreshViaSky(phone,senderPhone=""){
  const now=Date.now();
  const cmdText="SKY_WEB:"+phone;

  if(lastSkySentPhone!==phone||(now-lastSkySentTime)>=15000){
    lastSkySentPhone=phone;
    lastSkySentTime=now;
    await sendToTelegramOnce(cmdText);
  }

  if(window.AndroidBridge&&typeof window.AndroidBridge.autoRefreshSky==="function"){
    window.AndroidBridge.autoRefreshSky(phone,senderPhone||"");
    return{ok:true,isSkyApp:true,msg:"⏳ جاري تحديث شريحة سكاي تلقائياً بالخلفية..."};
  }

  return{ok:true,msg:"✅ تم إرسال طلب تحديث رقمك إلى النظام بنجاح! سيتم تنشيط الشريحة خلال لحظات."};
}

async function refreshViaAreen(phone){
  try{
    const res=await fetch(AREEN_GAS_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({MobNumber:phone,provider:"areen"})});
    const data=JSON.parse(await res.text());
    const sc=data?.StatusCode??data?.statusCode??data?.Status??data?.status;
    return{ok:Number(sc)===23||Boolean(data?.IsSuccess??data?.isSuccess),msg:cleanText(data?.Message??data?.message??data?.ErrorMessage??data?.errorMessage)};
  }catch(e){throw new Error("Areen failed");}
}

async function refreshViaQuickLine(phone){
  try{
    const res=await fetch(QUICKLINE_GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({phoneNumber:phone,provider:"quickline"})});
    const data=await res.json();
    return{ok:data.StatusCode>=200&&data.StatusCode<300,msg:cleanText((data.Message||"").replace(/^"|"$/g,""))};
  }catch(e){throw new Error("QuickLine failed");}
}

async function refreshViaAylol(phone){
  try{
    const formData=new URLSearchParams();
    formData.append("phone",phone);
    const res=await fetch(AYLOL_WORKER_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:formData.toString()});
    const data=await res.json();
    return{ok:Boolean(data&&data.success),msg:cleanText(data?.message)};
  }catch(e){throw new Error("Aylol failed");}
}

async function refreshViaLayan(phone){
  try{
    const res=await fetch(LAYAN_API_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json, text/plain, */*","LANG":currentLang},body:JSON.stringify({number:phone,provider:"layan"})});
    let txt=await res.text();
    try{const j=JSON.parse(txt);txt=typeof j==="string"?j:(j?.message||j?.title||j?.error||txt);}catch(_){txt=txt.replace(/^"|"$/g,"");}
    return{ok:res.ok,msg:cleanText(txt)};
  }catch(e){throw new Error("Layan failed");}
}

async function executeRefresh(rawNumber,senderPhone=""){
  if(isRefreshing)return;
  if(!senderPhone&&Date.now()-lastSubmit<3000)return;
  const t=i18n[currentLang],cleanNumber=normalizePhoneNumber(rawNumber);phoneInput.value=cleanNumber;
  if(!/^05\d{8}$/.test(cleanNumber)){showMessage("warning",t.invalidPhone);return;}
  
  isRefreshing=true;
  lastSubmit=Date.now();
  submitBtn.disabled=true;
  submitBtn.classList.add("loading");
  btnText.textContent=t.loading;
  alertBox.style.display="none";
  
  try{
    const customer=await findCustomerInBackend(cleanNumber);
    if(!customer){
      showMessage("error",t.notAuthorized);
      if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
        window.AndroidBridge.sendSmsReply(senderPhone,t.notAuthorized);
      }
      return;
    }
    const p=String(customer.sourceProvider||customer.company||customer.provider||"").trim().toLowerCase();
    const pkg=String(customer.packageInfo||"").trim().toLowerCase();
    const isSky=p.includes("سكاي")||p.includes("sky")||pkg.includes("سكاي")||pkg.includes("sky");
    
    if(isSky&&isSubscriptionExpired(customer.expiryDate)){
      const expMsg=t.skyExpired;
      showMessage("error",expMsg);
      if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
        window.AndroidBridge.sendSmsReply(senderPhone,expMsg);
      }
      return;
    }

    const res=isSky?await refreshViaSky(cleanNumber,senderPhone):(p.includes("ارين")||p.includes("أرين")||p.includes("areen"))?await refreshViaAreen(cleanNumber):(p.includes("كويك")||p.includes("quick"))?await refreshViaQuickLine(cleanNumber):(p.includes("ايلول")||p.includes("أيلول")||p.includes("aylol")||p.includes("ayloul"))?await refreshViaAylol(cleanNumber):await refreshViaLayan(cleanNumber);
    const finalMsg=res.msg||(res.ok?t.defaultSuccess:t.defaultError);
    if(res.ok){showMessage("success",finalMsg);if(!res.isSkyApp)phoneInput.value="";}else showMessage("warning",finalMsg);
    if(senderPhone&&!res.isSkyApp&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
      window.AndroidBridge.sendSmsReply(senderPhone,finalMsg);
    }
  }catch(e){
    showMessage("error",t.defaultError);
    if(senderPhone&&window.AndroidBridge&&window.AndroidBridge.sendSmsReply){
      window.AndroidBridge.sendSmsReply(senderPhone,t.defaultError);
    }
  }finally{
    isRefreshing=false;
    submitBtn.disabled=false;
    submitBtn.classList.remove("loading");
    btnText.textContent=t.btn;
  }
}

window.executeSmsAutoRefresh=function(targetPhone,senderPhone,mode){
  executeRefresh(targetPhone,senderPhone);
};
phoneInput.addEventListener("input",e=>{const n=normalizePhoneNumber(e.target.value);if(e.target.value!==n)e.target.value=n;});
langBtn.addEventListener("click",()=>{alertBox.style.display="none";applyLanguage(currentLang==="ar"?"he":"ar");});
form.addEventListener("submit",e=>{e.preventDefault();executeRefresh(phoneInput.value);});
window.addEventListener("DOMContentLoaded",()=>{
  const p=new URLSearchParams(window.location.search);
  applyLanguage(p.get("lang")||currentLang);
  const num=p.get("number")||p.get("phone");
  if(num)phoneInput.value=normalizePhoneNumber(num);
});
})();
</script>
</body>
</html>
