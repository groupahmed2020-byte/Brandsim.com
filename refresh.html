<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAND SIM | تحديث وتنشيط الشرائح</title>
    <!-- خطوط العربية والعبرية -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;
            --brand: #2c9cdb;
            --brand-hover: #1b80b8;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        body[lang="he"] {
            font-family: 'Rubik', sans-serif;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
            padding: 45px 30px 30px;
            text-align: center;
            position: relative;
        }

        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            direction: ltr;
        }

        .logo-icon {
            background: var(--brand);
            color: #ffffff;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 14px rgba(44, 156, 219, 0.3);
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
            font-family: 'Rubik', sans-serif;
        }

        .logo-text span {
            color: var(--brand);
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            text-align: right;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 15px 18px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            text-align: center;
            direction: ltr;
            color: var(--primary);
            transition: all 0.2s ease;
            outline: none;
            background-color: #f8fafc;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(44, 156, 219, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            color: #ffffff;
            background-color: var(--brand);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(44, 156, 219, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--brand-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .alert-box {
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-box.success {
            display: flex;
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .alert-box.error {
            display: flex;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .footer-bar {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lang-btn {
            color: var(--brand);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--brand);
            transition: all 0.2s;
            user-select: none;
        }

        .lang-btn:hover {
            background-color: var(--brand);
            color: #ffffff;
        }

        .copyright {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            direction: ltr;
        }
    </style>
</head>
<body lang="ar">

    <div class="card">
        <div class="logo-wrapper">
            <div class="logo-icon"><i class="fas fa-sim-card"></i></div>
            <div class="logo-text">BRAND <span>SIM</span></div>
        </div>

        <h2 class="welcome-title" id="ui-welcome">مرحباً بك</h2>
        <p class="subtitle" id="ui-subtitle">يرجى إدخال رقم الهاتف لإجراء تحديث وتنشيط للشريحة</p>

        <form id="customer-refresh-number-form" novalidate>
            <div class="form-group">
                <label for="customerPhone" id="ui-label">رقم الهاتف</label>
                <input 
                    type="tel" 
                    id="customerPhone" 
                    class="form-control" 
                    placeholder="05XXXXXXXX" 
                    autocomplete="tel"
                    required
                >
            </div>

            <button type="submit" id="customSubmitBtn" class="btn-submit">
                <span id="ui-btn">تحديث</span>
                <i class="fas fa-sync-alt fa-spin spinner"></i>
            </button>
        </form>

        <div id="alertBox" class="alert-box"></div>

        <div class="footer-bar">
            <span class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">עברית</span>
            <span class="copyright">BRAND SIM © <script>document.write(new Date().getFullYear())</script></span>
        </div>
    </div>

    <script>
        const API_URL = "https://api.layan-t.net/api/Subscribtions/CustomersRefreshNumber";

        const i18n = {
            ar: {
                welcome: "مرحباً بك",
                subtitle: "يرجى إدخال رقم الهاتف لإجراء تحديث وتنشيط للشريحة",
                label: "رقم الهاتف",
                placeholder: "05XXXXXXXX",
                btn: "تحديث",
                loading: "جاري التحديث...",
                switchBtn: "עברית",
                emptyErr: "يرجى إدخال رقم الهاتف.",
                defaultSuccess: "تم تحديث الرقم بنجاح!",
                defaultError: "تعذر تحديث الرقم، يرجى التأكد من صحة الرقم."
            },
            he: {
                welcome: "ברוך הבא",
                subtitle: "נא להזין מספר טלפון כדי לבצע רענון למספר",
                label: "מספר טלפון",
                placeholder: "05XXXXXXXX",
                btn: "רענון",
                loading: "טוען...",
                switchBtn: "العربية",
                emptyErr: "שדה חובה.",
                defaultSuccess: "המספר רוענן בהצלחה!",
                defaultError: "פעולת הרענון נכשלה, בדוק את המספר."
            }
        };

        let currentLang = localStorage.getItem("language") || "ar";

        function applyLanguage(lang) {
            currentLang = lang === "he" ? "he" : "ar";
            localStorage.setItem("language", currentLang);
            const t = i18n[currentLang];

            document.body.setAttribute("lang", currentLang);
            document.getElementById("ui-welcome").textContent = t.welcome;
            document.getElementById("ui-subtitle").textContent = t.subtitle;
            document.getElementById("ui-label").textContent = t.label;
            document.getElementById("customerPhone").placeholder = t.placeholder;
            document.getElementById("ui-btn").textContent = t.btn;
            document.getElementById("langToggleBtn").textContent = t.switchBtn;
        }

        function toggleLanguage() {
            document.getElementById("alertBox").style.display = "none";
            applyLanguage(currentLang === "ar" ? "he" : "ar");
        }

        // دالة لتنظيف وتوحيد أي رقم يتم كتابته أو لصقه (يدعم الأرقام العربية ومقدمة الدولة)
        function normalizePhoneNumber(rawInput) {
            if (!rawInput) return "";
            
            // 1. تحويل الأرقام العربية والفارسية إلى إنجليزية
            let str = rawInput.toString()
                .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
                .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

            // 2. إبقاء الأرقام فقط
            str = str.replace(/[^0-9]/g, "");

            // 3. معالجة مقدمة الدولة (مثل 97254... أو 0097254... إلى 054...)
            if (str.startsWith("00972")) {
                str = "0" + str.slice(5);
            } else if (str.startsWith("972") && str.length > 9) {
                str = "0" + str.slice(3);
            }

            return str;
        }

        const form = document.getElementById("customer-refresh-number-form");
        const phoneInput = document.getElementById("customerPhone");
        const submitBtn = document.getElementById("customSubmitBtn");
        const btnText = document.getElementById("ui-btn");
        const alertBox = document.getElementById("alertBox");

        // تنسيق فوري أثناء الكتابة أو اللصق
        phoneInput.addEventListener("input", (e) => {
            const normalized = normalizePhoneNumber(e.target.value);
            if (e.target.value !== normalized) {
                e.target.value = normalized;
            }
        });

        function showMessage(type, text) {
            alertBox.className = `alert-box ${type}`;
            const icon = type === "success" ? "fa-check-circle" : "fa-times-circle";
            alertBox.innerHTML = `<i class="fas ${icon}"></i> <span>${text}</span>`;
            alertBox.style.display = "flex";
        }

        // إرسال الطلب مع بدائل تلقائية في حال وجود CORS
        async function sendRefreshRequest(phoneNumber) {
            const payload = JSON.stringify({ number: phoneNumber });
            const headers = {
                "Content-Type": "application/json",
                "Accept": "application/json, text/plain, */*",
                "LANG": currentLang
            };

            const endpoints = [
                API_URL,
                "https://corsproxy.io/?" + encodeURIComponent(API_URL)
            ];

            let lastError = null;
            for (const url of endpoints) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: headers,
                        body: payload
                    });
                    return response;
                } catch (err) {
                    lastError = err;
                }
            }
            throw lastError;
        }

        async function executeRefresh(rawNumber) {
            const t = i18n[currentLang];
            const cleanNumber = normalizePhoneNumber(rawNumber);
            phoneInput.value = cleanNumber;

            if (!cleanNumber) {
                showMessage("error", t.emptyErr);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add("loading");
            btnText.textContent = t.loading;
            alertBox.style.display = "none";

            try {
                const response = await sendRefreshRequest(cleanNumber);
                let responseText = await response.text();

                // محاولة استخراج الرسالة إذا كانت JSON أو نصاً عادياً
                try {
                    const json = JSON.parse(responseText);
                    if (typeof json === "string") {
                        responseText = json;
                    } else if (json && (json.message || json.title || json.error)) {
                        responseText = json.message || json.title || json.error;
                    }
                } catch (_) {
                    responseText = responseText.replace(/^"|"$/g, "").trim();
                }

                if (response.ok) {
                    showMessage("success", responseText || t.defaultSuccess);
                } else {
                    showMessage("error", responseText || t.defaultError);
                }
            } catch (err) {
                showMessage("error", t.defaultError);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove("loading");
                btnText.textContent = t.btn;
            }
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            executeRefresh(phoneInput.value);
        });

        // تهيئة الصفحة وفحص ما إذا تم إرسال رقم في الرابط (URL)
        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            
            // تغيير اللغة إذا أرسلت في الرابط ?lang=he أو ?lang=ar
            if (params.get("lang")) {
                applyLanguage(params.get("lang"));
            } else {
                applyLanguage(currentLang);
            }

            // التقاط الرقم المرسل عبر الرابط (يدعم ?number= أو ?phone=)
            const urlNumber = params.get("number") || params.get("phone");
            if (urlNumber) {
                phoneInput.value = normalizePhoneNumber(urlNumber);
                // إذا أُرسل &auto=1 في الرابط يتم التحديث تلقائياً فور فتح الصفحة
                if (params.get("auto") === "1" || params.get("auto") === "true") {
                    executeRefresh(urlNumber);
                }
            }
        });
    </script>
</body>
</html>
