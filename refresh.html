<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob: https: file: content:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com https://*.google.com; base-uri 'self'; form-action 'self';">

<title>BRAND SIM | تحديث وتنشيط الشرائح</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden !important;
  background-color: #04101c;
  color: #fff;
}
html {
  height: 100%;
  direction: ltr;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  overflow-y: auto;
  position: relative;
  overscroll-behavior-y: contain;
  margin: 0 auto;
}
body[lang="he"] * {
  font-family: 'Rubik', sans-serif;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100lvh;
  z-index: -1;
  background-image: linear-gradient(rgba(4, 16, 28, 0.22), rgba(4, 16, 28, 0.42)), url('tower-bg.jpg'), url('1000046718.jpg');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;
  pointer-events: none;
}
.card {
  direction: rtl;
  width: 100%;
  max-width: 440px;
  margin: auto;
  border: 2px solid #00e5ff;
  border-radius: 22px;
  padding: 24px 18px 20px;
  background: rgba(4, 18, 31, 0.52);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.logo-wrapper {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 12px;
  direction: ltr;
}
.logo-icon {
  background: rgba(0, 229, 255, 0.15);
  border: 1.5px solid #00e5ff;
  color: #00e5ff;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
  flex-shrink: 0;
}
.logo-icon i {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
}
.logo-text {
  font-size: clamp(1.65rem, 6vw, 2.05rem);
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 12px #00e5ff, 0 0 24px #00e5ff;
  white-space: nowrap;
}
.welcome-title {
  font-size: clamp(1.15rem, 4.5vw, 1.35rem);
  font-weight: 800;
  margin-bottom: 6px;
  color: #00e5ff;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
}
.subtitle {
  font-size: clamp(0.84rem, 3.4vw, 0.95rem);
  color: #e2f4fc;
  margin-bottom: 20px;
  line-height: 1.55;
  font-weight: 700;
  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
}
.form-group {
  text-align: right;
  margin-bottom: 16px;
  position: relative;
}
.form-group label {
  display: block;
  font-weight: 800;
  font-size: 0.92rem;
  margin-bottom: 8px;
  color: #00e5ff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
}
.form-control {
  width: 100%;
  min-height: 52px;
  padding: 12px 16px;
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  border: 1.5px solid rgba(0, 229, 255, 0.5);
  border-radius: 12px;
  text-align: center;
  direction: ltr;
  color: #fff;
  background: rgba(4, 21, 35, 0.82);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  appearance: none;
  -webkit-appearance: none;
}
.form-control::placeholder {
  color: rgba(194, 226, 242, 0.48);
}
.form-control:focus {
  border-color: #00e5ff;
  background: rgba(4, 21, 35, 0.95);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
}
.hp-trap {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  width: 0 !important;
  height: 0 !important;
  top: 0 !important;
  left: 0 !important;
  pointer-events: none !important;
}
.btn-submit {
  width: 100%;
  min-height: 52px;
  padding: 13px;
  font-size: 1.05rem;
  font-weight: 800;
  color: #001b29;
  background: linear-gradient(90deg, #00e5ff, #00a8cc);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.45);
  touch-action: manipulation;
  user-select: none;
}
.btn-submit:active {
  transform: scale(0.98);
}
.btn-submit:disabled {
  background: rgba(148, 163, 184, 0.4);
  color: #cbd5e1;
  cursor: not-allowed;
  box-shadow: none;
}
.spinner {
  display: none;
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
}
.btn-submit.loading .spinner {
  display: inline-block;
}
.alert-box {
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  line-height: 1.6;
  word-break: break-word;
  white-space: pre-line;
  background: rgba(6, 35, 53, 0.92);
}
.alert-box i {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
}
.alert-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
}
.cooldown-timer-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 4px;
  padding: 6px 18px;
  border-radius: 20px;
  background: rgba(255, 171, 0, 0.16);
  border: 1.5px solid rgba(255, 215, 64, 0.65);
  color: #fff;
  font-size: 1.05rem;
  font-weight: 800;
  direction: ltr;
  letter-spacing: 2px;
  box-shadow: 0 0 12px rgba(255, 171, 0, 0.25);
}
.cooldown-timer-badge i {
  color: #ffd740;
  font-size: 0.95rem;
}
.alert-box.success {
  display: flex;
  color: #69f0ae;
  border: 1.5px solid #00c853;
  box-shadow: 0 0 12px rgba(0, 200, 83, 0.25);
}
.alert-box.warning {
  display: flex;
  color: #ffd740;
  border: 1.5px solid #ffab00;
  box-shadow: 0 0 12px rgba(255, 171, 0, 0.25);
}
.alert-box.error {
  display: flex;
  color: #ff5252;
  border: 1.5px solid #ff1744;
  box-shadow: 0 0 12px rgba(255, 23, 68, 0.25);
}
.footer-bar {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid rgba(0, 229, 255, 0.25);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.lang-btn {
  color: #00e5ff;
  background: rgba(0, 229, 255, 0.12);
  font-weight: 800;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid #00e5ff;
  transition: 0.2s;
  user-select: none;
  touch-action: manipulation;
}
.lang-btn:active,
.lang-btn:hover {
  background: #00e5ff;
  color: #001b29;
  box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
}
.copyright {
  color: #c2e2f2;
  font-size: 0.82rem;
  font-weight: 700;
  direction: ltr;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  white-space: nowrap;
}
@media (max-width: 360px) {
  .card {
    padding: 20px 14px 16px;
    border-radius: 18px;
  }
  .form-control {
    font-size: 1.12rem;
    min-height: 48px;
  }
  .btn-submit {
    font-size: 0.98rem;
    min-height: 48px;
  }
}
</style>
</head>
<body lang="ar">
<div class="card">
  <div class="logo-wrapper">
    <div class="logo-icon"><i class="fas fa-sim-card"></i></div>
    <div class="logo-text">BRAND SIM</div>
  </div>
  <h2 class="welcome-title" id="ui-welcome">مرحباً بك في براند سيم</h2>
  <p class="subtitle" id="ui-subtitle">أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة</p>
  <form id="customer-refresh-number-form" novalidate>
    <div class="form-group">
      <label for="customerPhone" id="ui-label">📱 رقم الهاتف:</label>
      <input
        type="tel"
        id="customerPhone"
        class="form-control"
        placeholder="05XXXXXXXX"
        maxlength="16"
        inputmode="numeric"
        pattern="[0-9]*"
        enterkeyhint="send"
        autocomplete="tel"
        dir="ltr"
        required
      >
      <input type="text" id="websiteUrlTrap" name="b_hp_trap" class="hp-trap" tabindex="-1" autocomplete="new-password" aria-hidden="true">
    </div>
    <button type="submit" id="customSubmitBtn" class="btn-submit">
      <span id="ui-btn">تحديث الرقم الآن</span>
      <i class="fas fa-sync-alt fa-spin spinner"></i>
    </button>
  </form>
  <div id="alertBox" class="alert-box" role="alert"></div>
  <div class="footer-bar">
    <button type="button" class="lang-btn" id="langToggleBtn">עברית</button>
    <span class="copyright">BRAND SIM © <span id="yearSpan">2026</span></span>
  </div>
</div>

<script>
(function() {
  "use strict";
  if (window.top !== window.self) {
    try { window.top.location = window.self.location; } catch (e) {}
  }
  window.scrollTo(0, 0);
  document.getElementById("yearSpan").textContent = new Date().getFullYear();

  // رابط بوابة BRAND SIM (النسخة المحدثة Version 12)
  const GATEWAY_API_URL = "https://script.google.com/macros/s/AKfycbxpvDw2RXxnPflfrPHIgki51Qovtk9BS7p30tK8aoBIUXD6Hqs6SDsnxMYMX9AJo6OP/exec";

  const COOLDOWN_MS = 3 * 60 * 60 * 1000;
  const STORAGE_KEY = "brandsim_refresh_cooldowns";
  const memoryCooldowns = {};
  let countdownInterval = null;
  let activeCooldownPhone = null;

  const i18n = Object.freeze({
    ar: Object.freeze({
      welcome: "مرحباً بك في براند سيم",
      subtitle: "أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة",
      label: "📱 رقم الهاتف:",
      placeholder: "05XXXXXXXX",
      btn: "تحديث الرقم الآن",
      loading: "جاري الفحص والتحديث...",
      switchBtn: "עברית",
      invalidPhone: "يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05",
      notAuthorized: "عذراً، هذا الرقم غير مسجل في منظومة براند سيم (BRAND SIM) ولا يمكن تحديثه.",
      expiredSub: "الرقم منتهي اشتراكه، الرجاء التواصل مع المندوب من أجل التجديد",
      cooldownPrefix: "عذراً، لقد قمت بتحديث هذا الرقم مسبقاً.\nالوقت المتبقي لمعاودة التحديث: ",
      cooldownReady: "انتهت فترة الانتظار! يمكنك تحديث الرقم الآن.",
      defaultSuccess: "تم إرسال طلب تحديث وتنشيط الرقم بنجاح!",
      defaultError: "تعذر تحديث الرقم حالياً، يرجى التأكد من الرقم أو المحاولة لاحقاً."
    }),
    he: Object.freeze({
      welcome: "ברוך הבא ל-BRAND SIM",
      subtitle: "נא להזין מספר טלפון כדי לבצע רענון והפעלה לכרטיס ה-SIM",
      label: "📱 מספר טלפון:",
      placeholder: "05XXXXXXXX",
      btn: "רענון מספר כעת",
      loading: "בודק ומרענן...",
      switchBtn: "العربية",
      invalidPhone: "נא להזין מספר טלפון תקין בן 10 ספרות המתחיל ב-05",
      notAuthorized: "מספר זה אינו רשום במערכת BRAND SIM ולא ניתן לרענן אותו.",
      expiredSub: "המנוי של מספר זה פג תוקף, אנא פנה לנציג לצורך חידוש.",
      cooldownPrefix: "מספר זה כבר רוענן לאחרונה.\nהזמן שנותר לרענון חוזר: ",
      cooldownReady: "זמן ההמתנה הסתיים! ניתן לרענן את המספר כעת.",
      defaultSuccess: "המספר רוענן בהצלחה!",
      defaultError: "פעולת הרענון נכשלה, בדוק את המספר أو נסה شوب."
    })
  });

  let currentLang = "ar";
  try { if (localStorage.getItem("language") === "he") currentLang = "he"; } catch (e) {}
  let isRefreshing = false;
  let lastSubmit = 0;

  const form = document.getElementById("customer-refresh-number-form");
  const phoneInput = document.getElementById("customerPhone");
  const hpInput = document.getElementById("websiteUrlTrap");
  const submitBtn = document.getElementById("customSubmitBtn");
  const btnText = document.getElementById("ui-btn");
  const alertBox = document.getElementById("alertBox");
  const langBtn = document.getElementById("langToggleBtn");

  function stopCountdownTimer() {
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
    activeCooldownPhone = null;
  }

  function cleanText(s) {
    return String(s || "")
      .replace(/[\u0000-\u001F\u007F-\u009F<>]/g, "")
      .replace(/^[⚠️✅❌⚡⏳\s]+/u, "")
      .trim()
      .slice(0, 300);
  }

  function getCooldownRecords() {
    let records = Object.assign({}, memoryCooldowns);
    try {
      if (window.name && window.name.indexOf("BSIM:") === 0) {
        Object.assign(records, JSON.parse(window.name.slice(5)));
      }
    } catch (e) {}
    try {
      const sData = sessionStorage.getItem(STORAGE_KEY);
      if (sData) Object.assign(records, JSON.parse(sData));
    } catch (e) {}
    try {
      const lData = localStorage.getItem(STORAGE_KEY);
      if (lData) Object.assign(records, JSON.parse(lData));
    } catch (e) {}
    return records;
  }

  function persistCooldownRecords(records) {
    const now = Date.now();
    for (const num in records) {
      if (now - Number(records[num]) >= COOLDOWN_MS) {
        delete records[num];
        delete memoryCooldowns[num];
      } else {
        memoryCooldowns[num] = Number(records[num]);
      }
    }
    const json = JSON.stringify(records);
    try { window.name = "BSIM:" + json; } catch (e) {}
    try { sessionStorage.setItem(STORAGE_KEY, json); } catch (e) {}
    try { localStorage.setItem(STORAGE_KEY, json); } catch (e) {}
  }

  function getRemainingCooldownMs(phone) {
    const records = getCooldownRecords();
    const startTime = Number(records[phone] || 0);
    if (!startTime) return 0;
    const elapsed = Date.now() - startTime;
    return elapsed < COOLDOWN_MS ? (COOLDOWN_MS - elapsed) : 0;
  }

  function saveCooldown(phone, customRemainingMs) {
    const now = Date.now();
    const records = getCooldownRecords();
    const startTime = (typeof customRemainingMs === "number" && customRemainingMs > 0 && customRemainingMs <= COOLDOWN_MS)
      ? (now - (COOLDOWN_MS - customRemainingMs))
      : now;
    records[phone] = startTime;
    persistCooldownRecords(records);
  }

  function formatRemainingText(ms, lang) {
    const totalSec = Math.max(1, Math.ceil(ms / 1000));
    const hours = Math.floor(totalSec / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    const seconds = totalSec % 60;

    if (lang === "he") {
      const parts = [];
      if (hours === 1) parts.push("שעה אחת");
      else if (hours === 2) parts.push("שעתיים");
      else if (hours > 2) parts.push(hours + " שעות");

      if (minutes === 1) parts.push("דקה אחת");
      else if (minutes > 1) parts.push(minutes + " דקות");

      if (hours === 0 && seconds > 0) {
        parts.push(seconds + " שניות");
      }
      return parts.join(" و-") || (seconds + " שניות");
    }

    const parts = [];
    if (hours === 1) parts.push("ساعة واحدة");
    else if (hours === 2) parts.push("ساعتين");
    else if (hours > 2) parts.push(hours + " ساعات");

    if (minutes === 1) parts.push("دقيقة واحدة");
    else if (minutes === 2) parts.push("دقيقتين");
    else if (minutes >= 3 && minutes <= 10) parts.push(minutes + " دقائق");
    else if (minutes > 10) parts.push(minutes + " دقيقة");

    if (hours === 0 && seconds > 0) {
      if (seconds === 1) parts.push("ثانية واحدة");
      else if (seconds === 2) parts.push("ثانيتين");
      else if (seconds >= 3 && seconds <= 10) parts.push(seconds + " ثوانٍ");
      else parts.push(seconds + " ثانية");
    }
    return parts.join(" و ") || (seconds + " ثانية");
  }

  function formatDigitalClock(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return h + ":" + m + ":" + s;
  }

  function isCooldownServerResponse(data) {
    if (!data) return false;
    if (data.cooldown === true || data.isCooldown === true) return true;
    const msg = String(data.msg || data.rawMsg || "");
    return /قمت بتحديث.*مسبق|قمت بتحديث.*قبل|المحاولة.*بعد.*ساع|بعد\s*3\s*ساعات|لتكرار الطلب|3\s*שעות|רעננת.*לאחרונה|נסה.*בעוד/i.test(msg);
  }

  function extractServerRemainingMs(data) {
    if (!data) return 0;
    const msFields = [data.remainingMs, data.cooldownMs, data.timeLeftMs, data.waitMs, data.leftMs];
    for (let i = 0; i < msFields.length; i++) {
      if (Number(msFields[i]) > 0) return Number(msFields[i]);
    }
    const secFields = [data.remainingSeconds, data.retryAfter, data.secondsLeft, data.waitSeconds, data.leftSeconds];
    for (let i = 0; i < secFields.length; i++) {
      if (Number(secFields[i]) > 0) return Number(secFields[i]) * 1000;
    }
    const minFields = [data.remainingMinutes, data.minutesLeft, data.waitMinutes, data.leftMinutes];
    for (let i = 0; i < minFields.length; i++) {
      if (Number(minFields[i]) > 0) return Number(minFields[i]) * 60 * 1000;
    }
    const expFields = [data.expiresAt, data.cooldownUntil, data.unlockAt, data.nextAllowedAt];
    for (let i = 0; i < expFields.length; i++) {
      if (Number(expFields[i]) > Date.now()) return Number(expFields[i]) - Date.now();
    }
    const lastFields = [data.lastRefresh, data.lastUpdated, data.timestamp];
    for (let i = 0; i < lastFields.length; i++) {
      if (Number(lastFields[i]) > 0 && (Date.now() - Number(lastFields[i]) < COOLDOWN_MS)) {
        return COOLDOWN_MS - (Date.now() - Number(lastFields[i]));
      }
    }
    const msg = String(data.msg || data.rawMsg || "");
    const clockMatch = msg.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (clockMatch) {
      const h = Number(clockMatch[1] || 0);
      const m = Number(clockMatch[2] || 0);
      const s = Number(clockMatch[3] || 0);
      return ((h * 3600) + (m * 60) + s) * 1000;
    }
    const minMatch = msg.match(/(\d+)\s*(?:دقيقة|دقائق|דקות)/);
    if (minMatch) {
      let totalMin = Number(minMatch[1]);
      if (/ساعتين|שעתיים/.test(msg)) totalMin += 120;
      else if (/ساعة|שעה/.test(msg)) totalMin += 60;
      return totalMin * 60 * 1000;
    }
    return 0;
  }

  function showMessage(type, text) {
    stopCountdownTimer();
    const validType = ["success", "warning", "error"].indexOf(type) !== -1 ? type : "error";
    alertBox.className = "alert-box " + validType;
    alertBox.textContent = "";

    const row = document.createElement("div");
    row.className = "alert-row";

    const icon = document.createElement("i");
    icon.className = "fas " + (validType === "success" ? "fa-check-circle" : validType === "warning" ? "fa-exclamation-triangle" : "fa-times-circle");
    const span = document.createElement("span");
    span.textContent = cleanText(text);

    row.append(icon, span);
    alertBox.appendChild(row);
    alertBox.style.display = "flex";
  }

  function showCooldownMessage(phone) {
    stopCountdownTimer();
    activeCooldownPhone = phone;

    const renderTick = function() {
      const remainingMs = getRemainingCooldownMs(phone);
      const t = i18n[currentLang];

      if (remainingMs <= 0) {
        stopCountdownTimer();
        showMessage("success", t.cooldownReady);
        return;
      }

      alertBox.className = "alert-box warning";
      alertBox.textContent = "";

      const row = document.createElement("div");
      row.className = "alert-row";

      const icon = document.createElement("i");
      icon.className = "fas fa-exclamation-triangle";

      const span = document.createElement("span");
      span.textContent = t.cooldownPrefix + formatRemainingText(remainingMs, currentLang);

      row.append(icon, span);

      const badge = document.createElement("div");
      badge.className = "cooldown-timer-badge";
      const clockIcon = document.createElement("i");
      clockIcon.className = "fas fa-hourglass-half";
      const clockText = document.createElement("span");
      clockText.textContent = formatDigitalClock(remainingMs);
      badge.append(clockIcon, clockText);

      alertBox.append(row, badge);
      alertBox.style.display = "flex";
    };

    renderTick();
    countdownInterval = setInterval(renderTick, 1000);
  }

  function applyLanguage(lang) {
    currentLang = lang === "he" ? "he" : "ar";
    try { localStorage.setItem("language", currentLang); } catch (e) {}
    const t = i18n[currentLang];
    document.body.setAttribute("lang", currentLang);
    document.getElementById("ui-welcome").textContent = t.welcome;
    document.getElementById("ui-subtitle").textContent = t.subtitle;
    document.getElementById("ui-label").textContent = t.label;
    phoneInput.placeholder = t.placeholder;
    btnText.textContent = t.btn;
    langBtn.textContent = t.switchBtn;
    if (activeCooldownPhone) {
      showCooldownMessage(activeCooldownPhone);
    }
  }

  function normalizePhoneNumber(rawInput) {
    if (!rawInput) return "";
    let str = String(rawInput)
      .replace(/[٠-٩]/g, function(d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
      .replace(/[۰-۹]/g, function(d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); });
    if (str.indexOf("_") !== -1) str = str.split("_")[0];
    str = str.replace(/[^0-9]/g, "");
    if (str.indexOf("00972") === 0 || str.indexOf("00970") === 0) str = "0" + str.slice(5);
    else if ((str.indexOf("972") === 0 || str.indexOf("970") === 0) && str.length >= 11) str = "0" + str.slice(3);
    else if (str.length === 9 && str.indexOf("5") === 0) str = "0" + str;
    if (str.length > 10 && str.indexOf("05") === 0) str = str.slice(0, 10);
    return str;
  }

  async function executeRefresh(rawNumber, isUserEvent) {
    if (isRefreshing) return;
    const trapVal = (hpInput && !isUserEvent) ? hpInput.value : "";
    if (trapVal) return;

    const t = i18n[currentLang];
    const cleanNumber = normalizePhoneNumber(rawNumber);
    phoneInput.value = cleanNumber;

    if (!/^05\d{8}$/.test(cleanNumber)) {
      showMessage("warning", t.invalidPhone);
      return;
    }

    try { phoneInput.blur(); } catch (e) {}

    if (getRemainingCooldownMs(cleanNumber) > 0) {
      showCooldownMessage(cleanNumber);
      return;
    }

    if (Date.now() - lastSubmit < 3000) return;

    isRefreshing = true;
    lastSubmit = Date.now();
    submitBtn.disabled = true;
    submitBtn.classList.add("loading");
    btnText.textContent = t.loading;
    stopCountdownTimer();
    alertBox.style.display = "none";

    try {
      const res = await fetch(GATEWAY_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          phone: cleanNumber,
          lang: currentLang,
          hp: trapVal,
          ts: Date.now()
        }),
        redirect: "follow"
      });
      const data = await res.json();

      if (isCooldownServerResponse(data)) {
        const serverMs = extractServerRemainingMs(data);
        if (getRemainingCooldownMs(cleanNumber) <= 0) {
          saveCooldown(cleanNumber, serverMs > 0 ? serverMs : COOLDOWN_MS);
        } else if (serverMs > 0) {
          saveCooldown(cleanNumber, serverMs);
        }
        showCooldownMessage(cleanNumber);
        return;
      }

      if (data && data.ok) {
        saveCooldown(cleanNumber, Number(data.cooldownMs) > 0 ? Number(data.cooldownMs) : COOLDOWN_MS);
      }

      const rawMsg = (data && data.msg) ? data.msg : ((data && data.ok) ? t.defaultSuccess : t.defaultError);
      const finalMsg = cleanText(rawMsg);
      if (data && data.ok) {
        showMessage("success", finalMsg);
        phoneInput.value = "";
      } else {
        showMessage((data && data.type) ? data.type : "warning", finalMsg);
      }
    } catch (e) {
      showMessage("error", t.defaultError);
    } finally {
      isRefreshing = false;
      submitBtn.disabled = false;
      submitBtn.classList.remove("loading");
      btnText.textContent = t.btn;
    }
  }

  phoneInput.addEventListener("input", function(e) {
    const n = normalizePhoneNumber(e.target.value);
    if (e.target.value !== n) e.target.value = n;
  });

  phoneInput.addEventListener("paste", function(e) {
    try {
      const pasted = (e.clipboardData || window.clipboardData).getData("text");
      if (pasted) {
        e.preventDefault();
        phoneInput.value = normalizePhoneNumber(pasted);
      }
    } catch (err) {}
  });

  langBtn.addEventListener("click", function() {
    if (!activeCooldownPhone) {
      alertBox.style.display = "none";
    }
    applyLanguage(currentLang === "ar" ? "he" : "ar");
  });

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    executeRefresh(phoneInput.value, Boolean(e && e.isTrusted));
  });

  window.addEventListener("DOMContentLoaded", function() {
    window.scrollTo(0, 0);
    const p = new URLSearchParams(window.location.search);
    applyLanguage(p.get("lang") || currentLang);
    const num = p.get("number") || p.get("phone");
    if (num) phoneInput.value = normalizePhoneNumber(num);
  });
})();
</script>
</body>
