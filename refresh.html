<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAND SIM - تحديث الرقم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f6fa;
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 50px 28px 45px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .brand-mark {
            width: 28px;
            height: 8px;
            background: linear-gradient(135deg, #a51c74, #c2185b);
            border-radius: 10px 2px 2px 2px;
            margin: 0 auto 40px;
            transform: rotate(-10deg);
        }

        .title {
            color: #1a2533;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: #9aa5b1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .input-phone {
            width: 100%;
            height: 56px;
            font-size: 19px;
            font-family: inherit;
            text-align: center;
            letter-spacing: 3px;
            color: #2d3748;
            background-color: #ffffff;
            border: 1.5px solid #9c2770;
            border-radius: 12px;
            outline: none;
            margin-bottom: 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
            direction: ltr;
        }

        .input-phone::placeholder {
            color: #7b8794;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .input-phone:focus {
            border-color: #7b1fa2;
            box-shadow: 0 0 0 3px rgba(165, 28, 116, 0.12);
        }

        .btn-submit {
            width: 100%;
            height: 54px;
            background-color: #a51c74;
            color: #ffffff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #8e1663;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert-box {
            display: none;
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }

        .alert-success {
            background-color: #edf7ed;
            color: #1e4620;
            border: 1px solid #c8e6c9;
        }

        .alert-error {
            background-color: #fdeded;
            color: #5f2120;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-mark"></div>
        
        <h1 class="title">BRAND SIM - تحديث الرقم</h1>
        <p class="subtitle">أدخل رقم الهاتف لتحديث حزمة التصفح</p>

        <form id="refreshForm">
            <input 
                type="tel" 
                id="phoneInput" 
                name="phone" 
                class="input-phone" 
                placeholder="05XXXXXXXX" 
                inputmode="numeric" 
                maxlength="10" 
                required
                autocomplete="off"
            >
            <button type="submit" id="submitBtn" class="btn-submit">
                <span id="btnText">تحديث</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <div id="alertBox" class="alert-box"></div>
    </div>

    <script>
        const form = document.getElementById('refreshForm');
        const phoneInput = document.getElementById('phoneInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertBox = document.getElementById('alertBox');

        const TARGET_URL = 'https://rn.layan-t.net/Subscribtions/CustomersRefreshNumber';

        phoneInput.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            alertBox.style.display = 'none';

            const phone = phoneInput.value.trim();
            if (!/^05[0-9]{8}$/.test(phone)) {
                showAlert('يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05', 'error');
                return;
            }

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';

            try {
                // إرسال الطلب مباشرة بصيغة النماذج القياسية متجاوزاً قيود المتصفح (no-cors)
                const formParams = new URLSearchParams();
                formParams.append('number', phone);

                await fetch(TARGET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                    },
                    body: formParams.toString()
                });

                // إرسال طلب إضافي بصيغة JSON عبر وسيط لضمان قبول الخادم لأي من الصيغتين
                fetch('https://corsproxy.io/?' + encodeURIComponent(TARGET_URL), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ number: phone })
                }).catch(() => {});

                showAlert('تم إرسال طلب تحديث حزمة التصفح للرقم بنجاح!', 'success');
                phoneInput.value = '';
            } catch (error) {
                showAlert('حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert-box ' + (type === 'success' ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }
    </script>

</body>
</html>
