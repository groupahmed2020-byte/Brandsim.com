<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAND SIM | تحديث وتنشيط الشرائح</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0f172a;--brand:#2c9cdb;--brand-hover:#1b80b8;--bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);--card-bg:#ffffff;--text-main:#1e293b;--text-muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg-gradient);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
body[lang="he"]{font-family:'Rubik',sans-serif}
.card{background:var(--card-bg);width:100%;max-width:450px;border-radius:26px;box-shadow:0 20px 45px rgba(0,0,0,0.35);padding:40px 26px 28px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;right:0;left:0;height:6px;background:linear-gradient(90deg,#2563eb,#38bdf8,#1d4ed8)}
.logo-wrapper{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;direction:ltr}
.logo-icon{background:var(--brand);color:#fff;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 14px rgba(44,156,219,0.3)}
.logo-text{font-size:30px;font-weight:800;color:var(--primary);letter-spacing:0.5px;font-family:'Rubik',sans-serif}
.logo-text span{color:var(--brand)}
.welcome-title{font-size:22px;font-weight:800;margin-bottom:6px;color:var(--primary)}
.subtitle{font-size:14px;color:var(--text-muted);margin-bottom:26px;line-height:1.6;font-weight:500}
.form-group{text-align:right;margin-bottom:20px}
.form-group label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--primary)}
.form-control{width:100%;padding:14px 16px;font-size:20px;font-weight:700;letter-spacing:1.5px;border:2px solid #cbd5e1;border-radius:14px;text-align:center;direction:ltr;color:var(--primary);transition:all 0.2s ease;outline:none;background-color:#f8fafc}
.form-control:focus{background-color:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(44,156,219,0.15)}
.btn-submit{width:100%;padding:15px;font-size:17px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);border:none;border-radius:14px;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(37,99,235,0.3)}
.btn-submit:hover{opacity:0.95;transform:translateY(-1px)}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed;transform:none;box-shadow:none}
.spinner{display:none}
.btn-submit.loading .spinner{display:inline-block}
.alert-box{margin-top:20px;padding:14px 16px;border-radius:12px;font-size:14px;font-weight:700;display:none;align-items:center;justify-content:center;gap:10px;line-height:1.6;word-break:break-word}
.alert-box.success{display:flex;background-color:#dcfce7;color:#166534;border:1px solid #86efac}
.alert-box.warning{display:flex;background-color:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alert-box.error{display:flex;background-color:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.footer-bar{margin-top:26px;padding-top:16px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
.lang-btn{color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;padding:5px 14px;border-radius:20px;border:1px solid var(--brand);transition:all 0.2s;user-select:none}
.lang-btn:hover{background-color:var(--brand);color:#fff}
.copyright{color:var(--text-muted);font-size:13px;font-weight:600;direction:ltr}
</style>
</head>
<body lang="ar">
<div class="card">
<div class="logo-wrapper"><div class="logo-icon"><i class="fas fa-sim-card"></i></div><div class="logo-text">BRAND <span>SIM</span></div></div>
<h2 class="welcome-title" id="ui-welcome">مرحباً بك في براند سيم</h2>
<p class="subtitle" id="ui-subtitle">أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة</p>
<form id="customer-refresh-number-form" novalidate>
<div class="form-group">
<label for="customerPhone" id="ui-label">رقم الهاتف</label>
<input type="tel" id="customerPhone" class="form-control" placeholder="05XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="tel" required>
</div>
<button type="submit" id="customSubmitBtn" class="btn-submit"><span id="ui-btn">تحديث الرقم الآن</span><i class="fas fa-sync-alt fa-spin spinner"></i></button>
</form>
<div id="alertBox" class="alert-box"></div>
<div class="footer-bar"><span class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">עברית</span><span class="copyright">BRAND SIM © <script>document.write(new Date().getFullYear())</script></span></div>
</div>
<script>
const GAS_PROXY_URL = "https://script.google.com/macros/s/AKfycbzLZSmUcm7nOwmhL61EikTU86nbQFCmZswydKQmXotdWyPc0fyDVOQx6wFE-CtXDgNl/exec";
const SKY_PORTAL_URL = "https://rn.sky-5g.net";

const i18n = {
ar: { welcome: "مرحباً بك في براند سيم", subtitle: "أدخل رقم الهاتف لإجراء تحديث وتنشيط فوري للشريحة", label: "رقم الهاتف", placeholder: "05XXXXXXXX", btn: "تحديث الرقم الآن", loading: "جاري الفحص والتحديث...", switchBtn: "עברית", invalidPhone: "يرجى إدخال رقم هاتف صحيح مكون من 10 أرقام ويبدأ بـ 05", notAuthorized: "عذراً، هذا الرقم غير مسجل في منظومة براند سيم (BRAND SIM) ولا يمكن تحديثه.", defaultSuccess: "✅ تم إرسال طلب تحديث وتنشيط الرقم بنجاح!", defaultError: "⚠️ تعذر تحديث الرقم حالياً، يرجى التأكد من الرقم أو المحاولة لاحقاً." },
he: { welcome: "ברוך הבא ל-BRAND SIM", subtitle: "נא להזין מספר טלפון כדי לבצע רענון והפעלה לכרטיס ה-SIM", label: "מספר טלפון", placeholder: "05XXXXXXXX", btn: "רענון מספר כעת", loading: "בודק وמרענן...", switchBtn: "العربية", invalidPhone: "נא להזין מספר טלפון תקין בן 10 ספרות המתחיל ב-05", notAuthorized: "מספר זה אינו רשום במערכת BRAND SIM ולא ניתן לרענן אותו.", defaultSuccess: "✅ המספר רוענן בהצלחה!", defaultError: "⚠️ פעולת הרענון נכשלה, בדוק את המספר أو نסה شוב." }
};

let currentLang = localStorage.getItem("language") || "ar";

function applyLanguage(lang) {
    currentLang = lang === "he" ? "he" : "ar";
    localStorage.setItem("language", currentLang);
    const t = i18n[currentLang];
    document.body.setAttribute("lang", currentLang);
    document.getElementById("ui-welcome").textContent = t.welcome;
    document.getElementById("ui-subtitle").textContent = t.subtitle;
    document.getElementById("ui-label").textContent = t.label;
    document.getElementById("customerPhone").placeholder = t.placeholder;
    document.getElementById("ui-btn").textContent = t.btn;
    document.getElementById("langToggleBtn").textContent = t.switchBtn;
}

function toggleLanguage() {
    document.getElementById("alertBox").style.display = "none";
    applyLanguage(currentLang === "ar" ? "he" : "ar");
}

function normalizePhoneNumber(rawInput) {
    if (!rawInput) return "";
    let str = rawInput.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
    if (str.includes("_")) str = str.split("_")[0];
    str = str.replace(/[^0-9]/g, "");
    if (str.startsWith("00972") || str.startsWith("00970")) str = "0" + str.slice(5);
    else if ((str.startsWith("972") || str.startsWith("970")) && str.length >= 11) str = "0" + str.slice(3);
    else if (str.length === 9 && str.startsWith("5")) str = "0" + str;
    else if (str.length > 10 && str.startsWith("05")) str = str.slice(0, 10);
    return str;
}

const form = document.getElementById("customer-refresh-number-form");
const phoneInput = document.getElementById("customerPhone");
const submitBtn = document.getElementById("customSubmitBtn");
const btnText = document.getElementById("ui-btn");
const alertBox = document.getElementById("alertBox");

phoneInput.addEventListener("input", e => {
    const normalized = normalizePhoneNumber(e.target.value);
    if (e.target.value !== normalized) e.target.value = normalized;
});

// استخدام textContent بدلاً من innerHTML لمنع ثغرات XSS
function showMessage(type, text) {
    alertBox.className = "alert-box " + type;
    alertBox.innerHTML = '';
    const icon = document.createElement('i');
    icon.className = "fas " + (type === "success" ? "fa-check-circle" : (type === "warning" ? "fa-exclamation-triangle" : "fa-times-circle"));
    const span = document.createElement('span');
    span.textContent = text;
    alertBox.appendChild(icon);
    alertBox.appendChild(span);
    alertBox.style.display = "flex";
}

async function hashPhone(phone) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('BS_PHONE_2026_' + phone));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function findCustomerInSmsDb(cleanPhone) {
    let dbList = [];
    try {
        const res = await fetch("customers.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
            const remoteData = await res.json();
            if (Array.isArray(remoteData) && remoteData.length) { dbList = remoteData; }
        }
    } catch (e) {}
    
    const qHash = await hashPhone(cleanPhone);
    return dbList.find(c => c.phoneHash === qHash || normalizePhoneNumber(c.simPhone || "") === cleanPhone) || null;
}

async function refreshViaSky(phone) {
    try { await navigator.clipboard.writeText(phone); } catch (e) {}
    const win = window.open(SKY_PORTAL_URL, "_blank");
    if (!win) window.location.href = SKY_PORTAL_URL;
    return { ok: true, msg: "✅ تم التحقق! جاري تحويلك لبوابة سكاي (تم نسخ الرقم، قم بلصقه هناك)." };
}

async function executeRefresh(rawNumber) {
    const t = i18n[currentLang];
    const cleanNumber = normalizePhoneNumber(rawNumber);
    phoneInput.value = cleanNumber;
    if (!/^05\d{8}$/.test(cleanNumber)) { showMessage("warning", t.invalidPhone); return; }
    
    submitBtn.disabled = true; 
    submitBtn.classList.add("loading"); 
    btnText.textContent = t.loading; 
    alertBox.style.display = "none";
    
    try {
        const customer = await findCustomerInSmsDb(cleanNumber);
        if (!customer) { showMessage("error", t.notAuthorized); return; }
        
        const provider = String(customer.sourceProvider || "").trim().toLowerCase();
        let result;
        
        if (provider.includes("سكاي") || provider.includes("sky")) {
            result = await refreshViaSky(cleanNumber);
        } else {
            const res = await fetch(GAS_PROXY_URL, { 
                method: "POST", 
                redirect: "follow", 
                headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                body: JSON.stringify({ phoneNumber: cleanNumber, number: cleanNumber, MobNumber: cleanNumber, provider: provider || "areen", lang: currentLang }) 
            });
            const data = JSON.parse(await res.text() || "{}");
            const msg = data.message || data.Message || data.title || data.error || "";
            const statusCode = data?.StatusCode ?? data?.statusCode ?? data?.Status ?? data?.status;
            const isSuccess = data?.IsSuccess ?? data?.isSuccess ?? (Number(statusCode) === 23 || (statusCode >= 200 && statusCode < 300));
            
            result = { ok: isSuccess || res.ok, msg: msg.replace(/^"|"$/g, "").trim() };
        }
        
        if (result.ok) { 
            showMessage("success", result.msg || t.defaultSuccess); 
            phoneInput.value = ""; 
        } else {
            showMessage("warning", result.msg || t.defaultError);
        }
    } catch (err) { 
        showMessage("error", t.defaultError); 
    } finally { 
        submitBtn.disabled = false; 
        submitBtn.classList.remove("loading"); 
        btnText.textContent = t.btn; 
    }
}

form.addEventListener("submit", e => { e.preventDefault(); executeRefresh(phoneInput.value); });

window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    applyLanguage(params.get("lang") || currentLang);
    const urlNumber = params.get("number") || params.get("phone");
    if (urlNumber) {
        phoneInput.value = normalizePhoneNumber(urlNumber);
        if (params.get("auto") === "1" || params.get("auto") === "true") executeRefresh(urlNumber);
    }
});
</script>
</body>
</html>
