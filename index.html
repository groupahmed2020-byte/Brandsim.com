<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none';"><meta http-equiv="X-Content-Type-Options" content="nosniff"><meta name="referrer" content="no-referrer"><title>BRAND SIM - براند ستور</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}body{background-color:#04101c;color:#fff;padding:12px;min-height:100vh;overflow-x:hidden;position:relative}body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(4,16,28,0.15),rgba(4,16,28,0.3)),url('tower-bg.jpg');background-position:center center;background-repeat:no-repeat;background-size:cover}.main-wrap{max-width:480px;margin:0 auto;border:2px solid #00e5ff;border-radius:22px;padding:16px 12px;background:rgba(4,18,31,0.25);box-shadow:0 0 25px rgba(0,229,255,0.3)}#bookingOverlay{display:none;position:fixed;inset:0;background:rgba(2,10,18,0.85);backdrop-filter:blur(6px);z-index:2000;align-items:center;justify-content:center;padding:14px}#bookingOverlay.active{display:flex;animation:fadeIn .2s ease}.modal-box{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:radial-gradient(circle at top,#0a273d 0%,#04121f 100%);border:2px solid #00e5ff;border-radius:20px;padding:18px 14px;box-shadow:0 0 28px rgba(0,229,255,0.4)}@keyframes fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}.booking-title{color:#00e5ff;font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:12px;text-shadow:0 0 10px rgba(0,229,255,0.4)}.booking-card{background:#062335;border:1px solid rgba(0,229,255,0.45);border-radius:14px;padding:12px 10px;text-align:center;font-weight:700;font-size:.95rem;line-height:1.7;color:#fff;margin-bottom:12px;box-shadow:inset 0 0 12px rgba(0,229,255,0.1)}.form-group{margin-bottom:10px;text-align:right}.form-label{display:block;font-size:.85rem;font-weight:700;color:#8ab4c9;margin-bottom:4px}.form-input,.form-select{width:100%;background:#041523;border:1px solid rgba(0,229,255,0.35);border-radius:10px;padding:9px 12px;color:#fff;font-size:.92rem;font-weight:600;outline:none;transition:.2s}.form-input:focus,.form-select:focus{border-color:#00e5ff;box-shadow:0 0 8px rgba(0,229,255,0.3)}.error-msg{color:#ff5252;font-size:.82rem;font-weight:700;text-align:center;margin:6px 0;display:none}.booking-actions{display:flex;gap:10px;margin-top:14px}.btn-wa{flex:1;background:linear-gradient(90deg,#00d2ff,#00a8cc);color:#001b29;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 0 12px rgba(0,210,255,0.4)}.btn-close{background:rgba(255,255,255,0.08);color:#b0cddb;border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.brand-header{text-align:center;margin:10px 0 20px}.brand-logo{font-size:2.3rem;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px #00e5ff,0 0 24px #00e5ff,0 0 38px #00b8d4}.brand-sub{color:#ffffff;font-size:.95rem;font-weight:700;margin-top:8px;line-height:1.6;text-shadow:0 2px 6px rgba(0,0,0,0.9)}.tabs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.tab-box{background:rgba(6,27,43,0.45);border:1.5px solid rgba(0,229,255,0.45);border-radius:16px;padding:16px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.2s;text-shadow:0 1px 4px rgba(0,0,0,0.8)}.tab-box.active{border-color:#00e5ff;box-shadow:0 0 15px rgba(0,229,255,0.35);background:rgba(8,38,58,0.65)}.tab-text{font-weight:800;font-size:1.05rem;line-height:1.4;text-align:center;flex:1}.tab-icon{width:38px;height:48px;border:1.5px solid #00e5ff;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,229,255,0.12);font-size:1.2rem}.section-banner{background:linear-gradient(90deg,rgba(8,54,79,0.55),rgba(6,34,53,0.55));border:1.5px solid #00e5ff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;box-shadow:0 0 14px rgba(0,229,255,0.2)}.banner-title{color:#00e5ff;font-size:1.25rem;font-weight:800;text-shadow:0 0 8px rgba(0,229,255,0.45)}.company-count{border:1.5px solid #00e5ff;border-radius:14px;padding:6px 14px;text-align:center;font-weight:700;font-size:.9rem;color:#fff;background:rgba(0,229,255,0.15)}.company-card{background:rgba(6,26,41,0.38);border:1px solid rgba(0,229,255,0.4);border-radius:18px;padding:14px 12px;margin-bottom:16px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}.company-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}.company-name{font-size:1.15rem;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.85)}.esim-badge{background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.5);color:#00e5ff;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:20px}.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pkg-box{background:rgba(4,19,31,0.48);border:1px solid rgba(0,229,255,0.2);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}.pkg-top{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pkg-title{font-weight:700;font-size:.92rem;color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,0.9)}.status-tag{background:rgba(0,200,83,0.2);border:1px solid #00c853;color:#69f0ae;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:12px}.pkg-price{color:#00e5ff;font-size:1.35rem;font-weight:800;margin:6px 0 10px;text-shadow:0 2px 6px rgba(0,0,0,0.9)}.btn-book{background:linear-gradient(180deg,#18c8ff,#0099cc);color:#fff;border:none;border-radius:10px;padding:8px 10px;font-weight:800;font-size:.9rem;cursor:pointer;width:100%;box-shadow:0 0 10px rgba(0,200,255,0.35);transition:.2s}.btn-book:active{transform:scale(0.97)}.btn-disabled{background:#455a64;color:#b0bec5;border:none;border-radius:10px;padding:8px 10px;font-weight:700;font-size:.85rem;cursor:not-allowed;width:100%}.float-contact{position:fixed;bottom:18px;left:18px;background:rgba(6,34,53,0.92);border:1.5px solid #00e5ff;color:#fff;padding:10px 18px;border-radius:30px;font-weight:800;font-size:.95rem;box-shadow:0 0 16px rgba(0,229,255,0.45);cursor:pointer;z-index:999;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}.msg-box{text-align:center;padding:30px 15px;color:#00e5ff;font-weight:800;font-size:1.1rem;background:rgba(6,26,41,0.55);border:1px solid rgba(0,229,255,0.4);border-radius:16px}</style></head><body><div id="bookingOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box"><div class="booking-title" id="modalTitle">🛒 حجز الطلب عبر واتساب</div><div class="booking-card" id="selectedPkgText"></div><div class="form-group"><label class="form-label" for="pkgDesc">📦 الباقة / الوصف:</label><input type="text" id="pkgDesc" class="form-input" maxlength="60" readonly></div><div class="form-group"><label class="form-label" for="custName">👤 اسم الزبون:</label><input type="text" id="custName" class="form-input" placeholder="مثال: ابراهيم" maxlength="50" autocomplete="name"></div><div class="form-group"><label class="form-label" for="custPhone">📱 رقم الهاتف:</label><input type="tel" id="custPhone" class="form-input" placeholder="مثال: 0599783984" maxlength="15" inputmode="tel" autocomplete="tel"></div><div class="form-group"><label class="form-label" for="custAddr">📍 العنوان:</label><input type="text" id="custAddr" class="form-input" placeholder="مثال: Gaza" maxlength="80" autocomplete="street-address"></div><div class="form-group"><label class="form-label" for="payMethod">💵 طريقة الدفع:</label><select id="payMethod" class="form-select"><option value="الدفع عند الاستلام">الدفع عند الاستلام</option><option value="تحويل بنكي / محفظة">تحويل بنكي / محفظة</option></select></div><input type="text" id="hpBookingTrap" style="display:none!important;visibility:hidden!important;width:0;height:0" tabindex="-1" autocomplete="off"><div class="error-msg" id="formError">⚠️ يرجى إدخال الاسم، رقم هاتف صحيح، والعنوان</div><div class="booking-actions"><button type="button" class="btn-wa" id="confirmWaBtn">إرسال الطلب عبر واتساب</button><button type="button" class="btn-close" id="closeBookBtn">إغلاق</button></div></div></div><div class="main-wrap"><div class="brand-header"><div class="brand-logo">BRAND SIM</div><div class="brand-sub">براند ستور (BRAND STORE) - تفعيل فوري للشرائح الإلكترونية والبلاستيكية</div></div><div class="tabs-grid"><div class="tab-box active" id="tabEsim"><div class="tab-text">الشرائح<br>الالكترونية<br>(ESIM)</div><div class="tab-icon">📲</div></div><div class="tab-box" id="tabPlastic"><div class="tab-text">شرائح<br>بلاستيك</div><div class="tab-icon">💳</div></div></div><div class="section-banner"><div class="banner-title" id="bannerTitle">📲 الشرائح الالكترونية (ESIM)</div><div class="company-count" id="countBadge">0<br>شركة</div></div><div id="companiesContainer"></div></div><button type="button" class="float-contact" id="contactBtn">💬 تواصل معنا</button><script>(function(){"use strict";if(window.top!==window.self){try{window.top.location=window.self.location}catch(e){}}document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("keydown",e=>{if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&/[IJC]/i.test(e.key))||(e.ctrlKey&&/U/i.test(e.key)))e.preventDefault()});const _K="BSIM_SEC_2026",_d=b=>{const r=atob(b),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i)^_K.charCodeAt(i%_K.length);return new TextDecoder().decode(o)},_V=Object.freeze({wa:"e2R7eGZqcntsCwgG",gh:"Kic9PSxpamw+QlkcUSsnITg9fSYsMh1CV0YtIGYqLTwwMz5aXVdScGN7fXIxPDc6HXJAVyw3GiQyfSYsMh1TXVg2Nic5LHwhIitTHlhFLT12Pzo1eC4+W14="}),WHATSAPP_NUMBER=_d(_V.wa),ALLOWED_PAY=Object.freeze(["الدفع عند الاستلام","تحويل بنكي / محفظة"]),GH_API=_d(_V.gh);let cachedStoreData=null,isEsim=true,currentBooking=null,lastClick=0;const clean=s=>String(s||"").replace(/[\u0000-\u001F\u007F-\u009F\u200E\u200F\u202A-\u202E<>'"`\\*_~]/g,"").replace(/\s+/g," ").trim(),container=document.getElementById("companiesContainer"),bookingOverlay=document.getElementById("bookingOverlay"),selectedPkgText=document.getElementById("selectedPkgText"),formError=document.getElementById("formError"),countBadge=document.getElementById("countBadge");function fromBase64(b64){const bin=atob(b64.replace(/\s/g,"")),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}async function getStoreData(){if(cachedStoreData)return cachedStoreData;try{const r=await fetch(GH_API+"&t="+Date.now(),{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});if(r.ok){const j=await r.json();if(j&&j.content){cachedStoreData=JSON.parse(fromBase64(j.content));return cachedStoreData}}}catch(e){}try{const r2=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(r2.ok){cachedStoreData=await r2.json();return cachedStoreData}}catch(e){}return null}function closeModal(){bookingOverlay.classList.remove("active");document.body.style.overflow=""}function openSafe(url){const w=window.open(url,"_blank","noopener,noreferrer");if(w)w.opener=null}async function renderCompanies(){container.innerHTML=`<div class="msg-box">جاري التحديث</div>`;const storeData=await getStoreData();if(!storeData){if(countBadge)countBadge.innerHTML="0<br>شركة";container.innerHTML=`<div class="msg-box">جاري التحديث</div>`;return}const list=isEsim?(storeData.esim||[]):(storeData.plastic||[]),badgeLabel=isEsim?"الشرائح الالكترونية (ESIM)":"شرائح بلاستيك";if(countBadge)countBadge.innerHTML=list.length+"<br>شركة";container.textContent="";if(list.length===0){container.innerHTML=`<div class="msg-box">جاري التحديث</div>`;return}list.forEach(comp=>{const card=document.createElement("div");card.className="company-card";const head=document.createElement("div");head.className="company-head";const title=document.createElement("div");title.className="company-name";title.textContent="📌 "+comp.name;const badge=document.createElement("span");badge.className="esim-badge";badge.textContent=badgeLabel;head.append(title,badge);const grid=document.createElement("div");grid.className="pkg-grid";(comp.pkgs||[]).forEach(pkg=>{const isAvail=pkg.available!==false,box=document.createElement("div");box.className="pkg-box";const top=document.createElement("div");top.className="pkg-top";const pTitle=document.createElement("span");pTitle.className="pkg-title";pTitle.textContent=pkg.d;const status=document.createElement("span");status.className="status-tag";status.textContent=isAvail?"(متوفر)":"(غير متوفر)";if(!isAvail){status.style.borderColor="#ff5252";status.style.color="#ff8a80";status.style.background="rgba(255,82,82,0.18)"}top.append(pTitle,status);const price=document.createElement("div");price.className="pkg-price";price.textContent=pkg.p+" ₪";const btn=document.createElement("button");btn.type="button";if(isAvail){btn.className="btn-book";btn.textContent="🛒 حجز الطلب";btn.addEventListener("click",()=>{currentBooking=Object.freeze({company:comp.name,simType:isEsim?"شريحة إلكترونية (eSIM)":"شريحة بلاستيكية",durPrice:pkg.s+" ("+pkg.p+" ₪)",desc:pkg.g});selectedPkgText.textContent=comp.name+" | "+badgeLabel+" | "+pkg.s+" ("+pkg.p+" ₪) - متوفر";document.getElementById("pkgDesc").value=pkg.g;formError.style.display="none";bookingOverlay.classList.add("active");document.body.style.overflow="hidden"})}else{btn.className="btn-disabled";btn.textContent="غير متوفر حالياً";btn.disabled=true}box.append(top,price,btn);grid.appendChild(box)});card.append(head,grid);container.appendChild(card)})}document.getElementById("tabEsim").addEventListener("click",function(){isEsim=true;this.classList.add("active");document.getElementById("tabPlastic").classList.remove("active");document.getElementById("bannerTitle").textContent="📲 الشرائح الالكترونية (ESIM)";renderCompanies()});document.getElementById("tabPlastic").addEventListener("click",function(){isEsim=false;this.classList.add("active");document.getElementById("tabEsim").classList.remove("active");document.getElementById("bannerTitle").textContent="💳 شرائح بلاستيك";renderCompanies()});document.getElementById("confirmWaBtn").addEventListener("click",()=>{if(!currentBooking||Date.now()-lastClick<1500||(document.getElementById("hpBookingTrap")&&document.getElementById("hpBookingTrap").value))return;const name=clean(document.getElementById("custName").value),phone=clean(document.getElementById("custPhone").value).replace(/\s+/g,""),addr=clean(document.getElementById("custAddr").value),pay=clean(document.getElementById("payMethod").value);if(name.length<2||!/^\+?[0-9]{9,15}$/.test(phone)||addr.length<2||!ALLOWED_PAY.includes(pay)){formError.style.display="block";return}formError.style.display="none";lastClick=Date.now();const msg=["*طلب حجز جديد - براند ستور (BRAND STORE)* 🛒","--------------------------","📌 *الشركة:* "+currentBooking.company,"📦 *الباقة / الوصف:* "+currentBooking.desc,"💳 *نوع الشريحة:* "+currentBooking.simType,"⏳ *المدة والسعر:* "+currentBooking.durPrice,"👤 *اسم الزبون:* "+name,"📱 *رقم الهاتف:* "+phone,"📍 *العنوان:* "+addr,"💵 *طريقة الدفع:* "+pay].join("\n");openSafe("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg));closeModal()});document.getElementById("closeBookBtn").addEventListener("click",closeModal);bookingOverlay.addEventListener("click",e=>{if(e.target===bookingOverlay)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});document.getElementById("contactBtn").addEventListener("click",()=>openSafe("https://wa.me/"+WHATSAPP_NUMBER));renderCompanies()})();</script></body></html>
